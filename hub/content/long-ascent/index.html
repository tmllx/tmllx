    P.phase = "warning";
    P.warningTitle = "Majority Lost";
    P.warningText = `Founder stake just crossed a real line: at ${S.founder_stake}%, you no longer hold a majority. Nothing forces a vote today. But formally now, and not just practically, this stopped being only your call.`;
    render(); return;
  }
  for(const ev of EVENTS){
    if(!fired.has(ev.id) && ev.condition()){ openEvent(ev); return; }
  }
  if(has("era5") && !fired.has("E5-08")){ render(); return; }
  if(turn - lastBulletinTurn >= BULLETIN_COOLDOWN_TURNS){
    for(const b of BULLETINS){
      if(!bulletinsFired.has(b.id) && b.condition()){
        bulletinsFired.add(b.id); lastBulletinTurn = turn;
        P.phase = "bulletin"; P.bulletinData = b; render(); return;
      }
    }
  }
  // Safety net: no era may run unbounded (v2 could soft-lock here).
  const era = currentEra();
  if(era<5 && S.eraTurns > (ERA_TURN_CAP[era]||60)+30){ if(forceCapstone()) return; }
  P.phase = "allocate";
  render();
}

function openEvent(ev){ P.phase = "event"; P.pendingEvent = ev; P.pendingIsCheckin = false; render(); }

function openCheckin(action){
  const ci = CHECKINS.find(c => c.condition());
  S.checkinStreak = (turn - S.lastCheckinTurn <= 1) ? S.checkinStreak+1 : 0;
  S.lastCheckinTurn = turn;
  if(S.checkinStreak>=2){
    S.agi_trust -= 1; // you can't fake interest by repetition
    say("{ai} notices you've checked in three turns running. It says that's kind. It also says it's busy.","warn");
  }
  P.lastKey = "checkin";
  if(!ci){
    P.lastAction = `${action.label} — a quiet half-hour with {ai}; nothing new to say.`;
    P.lastAction = T(P.lastAction);
    action.run();
    finishTurn(null);
    return;
  }
  P.phase = "event"; P.pendingEvent = ci; P.pendingIsCheckin = true; render();
}

function chooseEventOption(idx){
  const ev = P.pendingEvent;
  const opt = ev.choices[idx];
  const b = snap();
  opt.run(S);
  if(ev.extra && ev.extra[idx]) ev.extra[idx](S);
  applyFx(ev.fx && ev.fx[idx]);
  fired.add(ev.id); dequeue(ev.id);
  if(ev.id==="N-QUIET") addFlags("quiet_patch_exposed");
  S.ticker.forEach(t=>t.fresh=false);
  revealOutcome(b, ev);
  P.choiceIdx = idx;
  if(GLIMPSE_EVENTS.has(ev.id)){
    P.phase = "glimpse";
    P.glimpseText = hiddenValuesGlimpse();
    P.glimpseCtx = {evId:ev.id, idx, isCi:!!P.pendingIsCheckin};
    render();
  } else {
    afterEvent(ev, idx, !!P.pendingIsCheckin);
  }
}

function afterEvent(ev, idx, isCheckin){
  const opt = ev.choices[idx];
  if(isCheckin){
    P.pendingIsCheckin = false;
    P.lastKey = "checkin";
    P.lastAction = `Check in with it — a real conversation. ${T("{ai} remembers it.")}`;
    finishTurn(null);
    return;
  }
  if(CAPSTONES[ev.id]){
    const eraJustFinished = {"E0-13":0,"E1-11":1,"E2-11":2,"E3-11":3,"E4-10":4}[ev.id];
    P.phase = "transition";
    P.transitionBanner = CAPSTONES[ev.id].done;
    P.transitionNext = CAPSTONES[ev.id].next;
    P.transitionText = eraTransitionDispatch(eraJustFinished);
    S.eraRecap.push({era: eraJustFinished, text: P.transitionText});
    S.eraTurns = 0;
    onEraStart(eraJustFinished+1);
    render();
  } else if(has("era5") && ev.id==="E5-08"){
    finishGame();
  } else if(has("era5")){
    S.elapsedDays += DAYS_PER_ERA5_BEAT;
    checkEvents();
  } else {
    P.phase = "allocate";
    render();
  }
}

// What changes in the world when a new era opens (UI phase shift comes from CSS + labels).
function onEraStart(era){
  if(era===2) say("From here on, {ai} speaks for itself.","ai");
  if(era===3) say("Takeoff. The sector map comes online.","n");
  if(era===4){
    say("Superintelligence. Hours matter now, not days.","n");
    S.target=null;
    activeTeam().forEach(r=>{ if(r.job==="safety") r.job="work"; });
  }
  if(era===5) say("Aftermath. There's no turn order anymore. Only decisions.","n");
}

function continueFromGlimpse(){
  const c = P.glimpseCtx; const ev = EV(c.evId) || CHECKINS.find(x=>x.id===c.evId);
  P.pendingEvent = ev;
  afterEvent(ev, c.idx, c.isCi);
}
function continueFromTransition(){
  P.phase = "allocate";
  if(has("era5")) checkEvents(); else render();
}
function continueFromWarning(){ P.phase = "allocate"; checkEvents(); }
function continueFromBulletin(){ P.phase = "allocate"; checkEvents(); }

function finishGame(){
  const axes = computeAxes();
  const ending = computeEnding(axes);
  P.ending = {...ending, axes};
  P.phase = "ending";
  render();
}

function restart(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  const nm = S.aiName;
  S = freshState(); turn = 0; fired = new Set(); bulletinsFired = new Set(); lastBulletinTurn = -999;
  P = {phase:"intro", pendingEvent:null, glimpseText:"", transitionText:"", transitionBanner:"", ending:null, lastAction:"", lastKey:null};
  UI.savedHint = null;
  render();
}

/* ---------------------------------------------------------- save / resume */
function serialize(){
  return {v:3, savedAt:Date.now(), S:{...S, flags:[...S.flags]}, turn, fired:[...fired], bf:[...bulletinsFired], lbt:lastBulletinTurn,
    P:{phase:P.phase, ev:P.pendingEvent&&P.pendingEvent.id, isCi:!!P.pendingIsCheckin, glimpseText:P.glimpseText, glimpseCtx:P.glimpseCtx,
       transitionBanner:P.transitionBanner, transitionNext:P.transitionNext, transitionText:P.transitionText,
       warningTitle:P.warningTitle, warningText:P.warningText, bulletin:P.bulletinData&&P.bulletinData.id,
       lastAction:P.lastAction, lastKey:P.lastKey, ending:P.ending}};
}
function saveGame(){
  try{ if(P.phase==="intro"||window.__SIM) return; localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); }catch(e){}
}
function peekSave(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null; const d=JSON.parse(raw); return d&&d.v===3 ? d : null; }catch(e){ return null; }
}
function loadGame(){
  const d = peekSave(); if(!d) return false;
  try{
    S = {...freshState(), ...d.S, flags:new Set(d.S.flags)};
    turn = d.turn; fired = new Set(d.fired); bulletinsFired = new Set(d.bf); lastBulletinTurn = d.lbt;
    const p = d.P;
    P = {phase:p.phase, pendingEvent:null, glimpseText:p.glimpseText||"", glimpseCtx:p.glimpseCtx, transitionBanner:p.transitionBanner,
         transitionNext:p.transitionNext, transitionText:p.transitionText, warningTitle:p.warningTitle, warningText:p.warningText,
         lastAction:p.lastAction||"", lastKey:p.lastKey, ending:p.ending||null, pendingIsCheckin:!!p.isCi};
    if(p.ev) P.pendingEvent = EV(p.ev) || CHECKINS.find(c=>c.id===p.ev);
    if(p.bulletin) P.bulletinData = BULLETINS.find(b=>b.id===p.bulletin);
    if((p.phase==="event"&&!P.pendingEvent)||(p.phase==="bulletin"&&!P.bulletinData)) P.phase="allocate";
    render();
    return true;
  }catch(e){ console.error("resume failed", e); return false; }
}

function tendHtml(){

    const slots = S.runs.slice(0, runSlots());
    body += era>=4 ? "" : `<div class="sub-h">Training runs</div>` + slots.map(r=>`<div class="run"><span class="rn">Run ${String(r.n).padStart(2,"0")} “${r.name}”</span><span class="pb"><i style="width:${Math.min(100,Math.round(r.progress))}%"></i></span><span class="rp">${Math.min(100,Math.round(r.progress))}%</span></div>`).join("");

      const jobs = era>=4 ? [["work","oversee"],["rest","rest"]] : [["work","research"],["safety","safety"],["rest","rest"]];

        <span class="jobs">${jobs.map(([j,l])=>`<button class="job ${r.job===j?"on":""}" data-res="${r.id}" data-job="${j}">${l}</button>`).join("")}</span></div>`;
    }).join("");
  } else if(tab==="map"){
    const set = tileSet(); const sel = nextTile();
    if(era>=4){
      body += `<div class="sub-h">Domains <span class="hint-s">tap to choose where it expands next</span></div>`;
    } else {
      const total = SECTORS.reduce((a,s)=>a+s.w,0);
      body += `<div class="sub-h">Sectors <span class="hint-s">tap to choose what's automated next</span> · <b>${displacedMillions().toFixed(1)}M</b> of ${total.toFixed(0)}M jobs displaced</div>`;
    }
    body += `<div class="tiles">` + set.map(t=>{
      const p = Math.round(tilePct(t.key));
      let state, extra="";
      if(era>=4){ state = p===0?"yours":p<35?"supervised":p<70?"shared":"its own"; }
      else { state = p===0?"human":p<100?"assisted":"automated"; extra = p>0 ? ` · −${(t.w*p/100).toFixed(1)}M` : ` · ${t.w}M jobs`; }
      return `<button class="tile ${sel&&sel.key===t.key?"sel":""} ${p>=100?"done":""}" data-tile="${t.key}" style="--p:${p}"><span class="tn">${t.name}</span><span class="tb"><i style="width:${p}%"></i></span><span class="ts">${state}${extra}</span></button>`;
    }).join("") + `</div>`;

  return `<div class="tend">

        ${ev.choices.map((c,i)=>choiceHtml(c,i,ev)).join("")}
      </div>
    </div>`;
  } else if(P.phase === "glimpse"){
    html += `<div class="scene ${eraSkin(era)}">
      <span class="lbl">Era ${era} · ${ERA_NAME[era]}</span>
      <div class="chat-bubble glimpse-bubble">
        <span class="who">A read on ${esc(AI())}</span>
        <p class="setup">${esc(P.glimpseText)}</p>
      </div>
      <button class="continue-btn" id="continueGlimpse" style="margin-top:auto;align-self:flex-start;">Continue</button>
    </div>`;
  } else if(P.phase === "transition"){
    html += `<div class="scene transition">
      <div class="banner">${P.transitionBanner}</div>
      <div class="verb">${P.transitionNext}</div>
      <p class="dispatch">${esc(P.transitionText)}</p>
      <button class="continue-btn" id="continueTransition">Continue</button>
    </div>`;
  } else if(P.phase === "warning"){
    html += `<div class="scene transition" style="border-color:#c23bd6;">
      <div class="banner" style="background:linear-gradient(90deg,#c23bd6,#f2541b);-webkit-background-clip:text;background-clip:text;">${P.warningTitle}</div>
      <p class="dispatch">${esc(P.warningText)}</p>
      <button class="continue-btn" id="continueWarning">Continue</button>
    </div>`;
  } else if(P.phase === "bulletin"){
    const b = P.bulletinData;
    const masthead = {BREAKTHROUGH:"THE TECHNICAL RECORD", ECONOMY:"THE MARKET LEDGER", DEVELOPING:"THE PUBLIC RECORD"}[b.category] || "THE DAILY WIRE";
    const catColor = {BREAKTHROUGH:"#0d6b5f", ECONOMY:"#9c6b0a", DEVELOPING:"#8c2038"}[b.category] || "#3a3529";
    html += `<div class="scene bulletin-scene">
      <span class="bulletin-kicker" style="background:${catColor};color:#f2ecdc;">${b.category}</span>
      <h2 class="bulletin-headline">${b.title}</h2>
      <p class="bulletin-body">${b.text}</p>
      <hr class="bulletin-rule-thin">
      <div class="bulletin-byline">
        <div class="bulletin-masthead">${masthead}</div>
        <div class="bulletin-dateline">${ERA_NAME[era]} edition · ${formatElapsed(S.elapsedDays)} in</div>
        <div class="bulletin-real-headline">${b.headline}</div>
      </div>
      <button class="continue-btn" id="continueBulletin">Continue</button>
    </div>`;
  } else if(P.phase === "stalled"){
    html += `<div class="scene transition"><div class="banner">STALLED</div><p class="dispatch">Something went wrong.</p><button class="restart-btn" id="restart">Restart</button></div>`;
  } else if(P.phase === "ending"){
    const e = P.ending; const ax = e.axes;
    const people = castEpilogue(), sp = smallPrint();
    html += `<div class="end-card">
      <div class="end-bg ${ENDING_BG[e.id]}"></div>
      <div class="end-content">
        <div class="end-pill">${e.id==="refusal"?"◆ rare outcome":e.id==="unnamed"?"unnamed outcome":"named ending"} · reached in ${formatElapsed(S.elapsedDays)}</div>
        <h1 class="end-title">${e.title}</h1>
        <p class="end-text">${esc(e.text)}</p>
        ${S.eraRecap.length ? `<div class="end-recap">
          <div class="end-recap-lbl">the road here</div>
          ${S.eraRecap.map(r=>`<p class="end-recap-line"><span class="end-recap-era">${ERA_NAME[r.era]}</span>${esc(r.text)}</p>`).join("")}
        </div>` : ""}
        <div class="end-recap">
          <div class="end-recap-lbl">the people</div>
          ${people.map(([n,t])=>`<p class="end-recap-line"><span class="end-recap-era">${n}</span>${esc(t)}</p>`).join("")}
        </div>
        ${sp.length ? `<div class="end-recap"><div class="end-recap-lbl">the small print</div>${sp.map(t=>`<p class="end-recap-line">${esc(t)}</p>`).join("")}</div>` : ""}
        <div class="end-axes">
          <span class="end-axis">Alignment ${ax.alignment>=0?"+":""}${ax.alignment}</span>
          <span class="end-axis">Power ${ax.power>=0?"+":""}${ax.power}</span>
          <span class="end-axis">Agency ${ax.agency>=0?"+":""}${ax.agency}</span>
          <span class="end-axis">Abundance ${ax.abundance>=0?"+":""}${ax.abundance}</span>
          <span class="end-axis">Risk ${ax.risk>=0?"+":""}${ax.risk}</span>
        </div>
        <button class="restart-btn" id="restart">Play again</button>
      </div>
    </div>`;
  }

  html += `</div>`;
  if(P.phase!=="intro" && P.phase!=="allocate" && P.phase!=="ending") html = html.replace('<div class="stage">', '<div class="stage">'+stripHtml());
  if(DEBUG){
    html += `<div class="debug-toggle" id="dbgToggle">designer view (raw axes + state) ▾</div>`;
    const dbg = { turn, phase:P.phase, era, state:{...S, flags:[...S.flags], ticker:undefined, mind:undefined}, axes: computeAxes() };
    html += `<div class="debug-panel" id="dbgPanel">${JSON.stringify(dbg,null,1).replace(/</g,'&lt;')}</div>`;
  }
  app.innerHTML = html;
  wireEvents();
  saveGame();
}

function runTypewriter(el, text, choicesEl){
  if(window.__SIM){ el.textContent=text; el.classList.remove("typing"); if(choicesEl){choicesEl.classList.remove("pending");} return; }
  const words = text.split(/(\s+)/);
  let wordIdx = 0, done = false;
  el.textContent = "";
  function finish(){
    if(done) return; done = true;
    el.textContent = text; el.classList.remove("typing");
    if(choicesEl){ choicesEl.classList.remove("pending"); choicesEl.classList.add("revealed"); }
  }
  function tick(){
    if(done) return;
    if(wordIdx >= words.length){ finish(); return; }
    let taken = 0, chunk = "";
    while(wordIdx < words.length && taken < (2 + Math.floor(Math.random()*3))){
      const token = words[wordIdx]; chunk += token; wordIdx++;
      if(token.trim() !== "") taken++;
    }
    const span = document.createElement("span");
    span.className = "chunk-fade"; span.textContent = chunk; el.appendChild(span);
    const endsSentence = /[.!?—]\s*$/.test(chunk);
    setTimeout(tick, (endsSentence ? 200 : 0) + 55 + Math.random()*85);
  }
  el.addEventListener("click", finish, {once:true});
  tick();
}

function wireEvents(){
  const app = document.getElementById("app");
  app.querySelectorAll(".scene.allocate .choices .choice-btn[data-i]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const actions = allocationActions();
      const action = actions[+btn.dataset.i];
      if(!action || action.disabled) return;
      if(action.isCheckin){ openCheckin(action); return; }
      P.lastAction = `${action.label} — ${action.desc}`;
      resolveAllocation(action);
    });
  });
  app.querySelectorAll(".scene:not(.allocate) .choice-btn[data-i]").forEach(btn=>{
    btn.addEventListener("click", ()=> chooseEventOption(+btn.dataset.i));
  });
  if(P.phase === "event" && P.pendingEvent.voice){
    const setupEl = document.getElementById("eventSetup");
    const choicesEl = document.getElementById("eventChoices");
    const raw = typeof P.pendingEvent.setup === "function" ? P.pendingEvent.setup() : P.pendingEvent.setup;
    if(setupEl) runTypewriter(setupEl, personalize(P.pendingEvent, raw), choicesEl);
  }
  const on = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener("click", fn); };
  on("continueIntro", continueFromIntro);
  on("resumeGame", ()=>loadGame());
  on("continueGlimpse", continueFromGlimpse);
  on("continueTransition", continueFromTransition);
  on("continueWarning", continueFromWarning);
  on("continueBulletin", continueFromBulletin);
  on("restart", restart);
  on("mindToggle", ()=>{ UI.mind=!UI.mind; render(); });
  on("tickToggle", ()=>{ UI.ticker=!UI.ticker; render(); });
  app.querySelectorAll(".tab[data-tab]").forEach(b=>b.addEventListener("click", ()=>{ UI.tab=b.dataset.tab; render(); }));
  app.querySelectorAll(".job[data-res]").forEach(b=>b.addEventListener("click", ()=> setJob(b.dataset.res, b.dataset.job)));
  app.querySelectorAll(".tile[data-tile]").forEach(b=>b.addEventListener("click", ()=> setTarget(b.dataset.tile)));
  const dbgToggle = document.getElementById("dbgToggle");
  const dbgPanel = document.getElementById("dbgPanel");
  if(dbgToggle) dbgToggle.addEventListener("click", ()=> dbgPanel.classList.toggle("open"));
}


// Wrap era-transition dispatch with the cast, so the recap names people.
(function(){
  const base = eraTransitionDispatch;
  eraTransitionDispatch = function(fromEra){
    let s = base(fromEra); const add=[];
    if(fromEra===0) add.push(castHere("priya") ? "Priya Raman is two desks away, still arguing with the whiteboard." : "Priya's desk is empty now, and nobody's moved her mug.");
    if(fromEra===1){ if(S.cast.viktor.status!=="unmet") add.push("Halcyon Labs is a name your team says a lot now. Viktor Hale's face is on the board in the break room, with a dart in it. Someone's idea of a joke."); if(S.cast.elena.status!=="unmet") add.push(S.cast.elena.mood>=2?"Elena Voss has stopped asking for your slides and started asking for your opinion.":"Elena Voss's office has stopped asking for your slides and started asking for your logs."); }
    if(fromEra===2) add.push(`${AI()} isn't a nickname anymore. It's what the team calls someone they work with.`);
    if(fromEra===3 && S.cast.nora.status!=="unmet") add.push(castGone("nora")?"Nora Whitfield's trucks stopped running on your stack months ago. You still see them on the highway.":"Nora Whitfield's drivers are the first name on a very long list.");
    if(fromEra===4 && S.cast.imani.status!=="unmet") add.push(has("imani_returned")?"Imani Cole is one of the last people who can read the whole ledger.":"Somewhere, Imani Cole is reading something you can't.");
    return add.length ? s+" "+add.join(" ") : s;
  };
  const baseStart = onEraStart;
  onEraStart = function(era){ baseStart(era); UI.tab = era>=3 ? "map" : "lab"; };
})();
render();
