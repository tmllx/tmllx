<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Long Ascent — v3</title>
<style>
  :root{
    --font-display: -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#0d0c10;color:#e8e6e1;font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  .shell{max-width:30rem;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---- chrome (visible resources only — no axis/relationship numbers, per the locked Visibility decision) ---- */
  .topbar{padding:.7rem 1.1rem .6rem;border-bottom:1px solid #2a2830;}
  .title{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:#9a86b0;}
  .hud{background:#1a1522;border:1.5px solid #3a2f44;border-radius:8px;padding:.55rem .8rem;margin-top:.5rem;}
  .hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;}
  .era-flag{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;background:linear-gradient(90deg,#f2541b,#c23bd6);color:#fff;padding:.2rem .5rem;border-radius:20px;font-weight:700;}
  .verb-flag{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;color:#ffb08a;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;}
  .stat{display:flex;flex-direction:column;gap:.05rem;}
  .stat .k{font-family:var(--font-mono);font-size:.55rem;text-transform:uppercase;letter-spacing:.03em;color:#9a86b0;}
  .stat .v{font-family:var(--font-display);font-weight:800;font-size:.86rem;color:#f2ede0;}

  /* ---- stage ---- */
  .stage{flex:1;padding:1rem 1.1rem 1.3rem;display:flex;flex-direction:column;}
  .scene{border-radius:6px;padding:1.3rem;flex:1;display:flex;flex-direction:column;}
  .scene .lbl{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.8rem;display:block;}
  .scene .tag{font-family:var(--font-mono);font-size:.6rem;font-weight:700;color:#fff;padding:.12rem .5rem;border-radius:20px;display:inline-block;margin-bottom:.55rem;}
  .scene .tag.ambient{background:#2f5fda;}
  .scene .tag.voice{background:linear-gradient(90deg,#7a3fd6,#c23bd6);margin-left:.4rem;}
  .scene h2{font-family:var(--font-display);font-weight:800;font-size:1.2rem;text-transform:uppercase;margin:0 0 .45rem;letter-spacing:-.005em;line-height:1.12;}
  .scene p.setup{margin:0 0 1.1rem;font-size:.87rem;line-height:1.5;}
  .chat-bubble{background:rgba(122,63,214,.14);border:1.5px solid rgba(122,63,214,.5);border-radius:14px 14px 14px 4px;padding:.85rem 1rem;margin-bottom:1.1rem;max-width:94%;}
  .chat-bubble .who{display:block;font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#9a5fd6;margin-bottom:.4rem;}
  .chat-bubble p.setup{margin:0;font-style:italic;}
  .scene p.setup.voice-type{font-family:var(--font-mono);letter-spacing:.01em;cursor:pointer;}
  .scene p.setup.voice-type.typing::after{content:"▍";opacity:.7;animation:blink 1s step-start infinite;font-style:normal;}
  @keyframes blink{50%{opacity:0;}}
  .chunk-fade{animation:chunkFadeIn .18s ease-out;}
  @keyframes chunkFadeIn{from{opacity:0;}to{opacity:1;}}
  .choices{display:flex;flex-direction:column;gap:.55rem;margin-top:auto;}
  .choices.pending{opacity:0;pointer-events:none;}
  .choices.revealed{opacity:1;transition:opacity .35s ease;}
  .choice-btn.voice-choice .desc{color:#9a5fd6;opacity:1;}
  .choice-btn.voice-choice .desc::before{content:"→ ";}
  .choice-btn{border-radius:5px;padding:.65rem .8rem;font-size:.85rem;font-weight:600;font-family:var(--font-body);text-align:left;cursor:pointer;}
  .choice-btn .desc{display:block;font-family:var(--font-mono);font-weight:400;font-size:.68rem;margin-top:.2rem;opacity:.75;}
  .choice-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* light era skin (0–1) */
  .scene.era-light{background:#f5efe0;color:#14120f;background-image:linear-gradient(#14120f 1px,transparent 1px),linear-gradient(90deg,#14120f 1px,transparent 1px);background-size:26px 26px;position:relative;}
  .scene.era-light::before{content:"";position:absolute;inset:0;background:#f5efe0;opacity:.94;border-radius:6px;}
  .scene.era-light > *{position:relative;z-index:1;}
  .scene.era-light .lbl{color:#7a2607;}
  .scene.era-light .tag{background:#f2541b;}
  .scene.era-light .choice-btn{background:#efe6cf;border:1.5px solid #14120f;color:#14120f;}

  /* dusk era skin (2–3) */
  .scene.era-dusk{background:#4b3d4a;color:#f2ede0;}
  .scene.era-dusk .lbl{color:#ffb08a;}
  .scene.era-dusk .tag{background:linear-gradient(90deg,#f2541b,#a84fce);}
  .scene.era-dusk .choice-btn{background:#3a2e3a;border:1px solid #6b5769;color:#f2ede0;}

  /* dark era skin (4–5) */
  .scene.era-dark{background:#141018;color:#f2ede0;}
  .scene.era-dark .lbl{color:#f2541b;}
  .scene.era-dark .tag{background:linear-gradient(90deg,#f2541b,#c23bd6);}
  .scene.era-dark .choice-btn{background:#231b2e;border:1px solid #3a2f44;color:#f2ede0;}

  /* ---- allocation phase ---- */
  /* Tuned tighter than the narrative-event scene styles on purpose — this
     screen repeats every turn and the action set only grows (5-7 choices by
     Era 4), so it has to fit a 480x900 iOS viewport without scrolling, where
     the one-off event/ending screens have more room to breathe. */
  .scene.allocate{padding:1rem 1.1rem;}
  .scene.allocate .lbl{margin-bottom:.25rem;}
  .scene.allocate h2{font-size:1rem;margin-bottom:.2rem;}
  .scene.allocate .last-action{margin:0 0 .5rem;font-size:.72rem;line-height:1.35;color:#b8adc4;}
  .scene.allocate .choices{gap:.4rem;}
  .scene.allocate .choice-btn{padding:.5rem .65rem;font-size:.8rem;}
  .scene.allocate .choice-btn .desc{font-size:.62rem;line-height:1.3;margin-top:.15rem;}

  /* ---- glimpse / dispatch ---- */
  .scene.glimpse{background:#1a1522;border:1.5px solid #6b5769;color:#e5dcf0;justify-content:center;text-align:center;}
  .scene.glimpse .glimpse-mark{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:#c9a6e0;margin-bottom:.8rem;}
  .scene.glimpse p{font-family:var(--font-display);font-size:1.05rem;line-height:1.5;max-width:24rem;margin:0 auto 1.4rem;}

  /* ---- era transition ---- */
  .scene.transition{background:#141018;border:1.5px solid #3a2f44;color:#f2ede0;justify-content:center;text-align:center;}
  .scene.transition .banner{font-family:var(--font-display);font-weight:800;font-size:1.3rem;text-transform:uppercase;background:linear-gradient(90deg,#f2541b,#c23bd6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.6rem;}
  .scene.transition .verb{font-family:var(--font-mono);font-size:.72rem;color:#ffb08a;text-transform:uppercase;margin-bottom:1.2rem;}
  .scene.transition p.dispatch{font-size:.94rem;line-height:1.55;max-width:24rem;margin:0 auto 1.5rem;color:#e5dcf0;}

  .continue-btn{background:#fff;color:#14120f;border:none;border-radius:5px;padding:.7rem 1.3rem;font-weight:700;font-family:var(--font-body);cursor:pointer;align-self:center;}

  /* ---- bulletin (newsprint clipping) ---- */
  .scene.bulletin-scene{background:#f2ecdc;color:#1a1712;justify-content:center;text-align:center;border-width:1.5px;}
  .bulletin-rule-thin{border:none;border-top:.5px solid #a89f8c;margin:1rem 0;}
  .bulletin-kicker{font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-block;padding:.15rem .55rem;border-radius:2px;margin-bottom:.6rem;}
  .bulletin-headline{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.4rem;line-height:1.18;margin:0 0 .8rem;color:#14120f;}
  .bulletin-body{font-family:Georgia,"Times New Roman",serif;font-size:.92rem;line-height:1.6;color:#2a251e;max-width:23rem;margin:0 auto;}
  .bulletin-body::first-letter{font-size:1.9em;font-weight:700;float:left;line-height:.8;padding-right:.12rem;padding-top:.1rem;}
  .bulletin-byline{max-width:23rem;margin:0 auto;}
  .bulletin-masthead{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#6b6355;}
  .bulletin-dateline{font-family:var(--font-mono);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:#a89f8c;margin:.2rem 0 .55rem;}
  .bulletin-real-headline{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:.82rem;letter-spacing:.01em;line-height:1.35;color:#14120f;}
  .scene.bulletin-scene .continue-btn{background:#1a1712;color:#f2ecdc;margin-top:1.4rem;}

  /* ---- ending ---- */
  .end-card{position:relative;border-radius:6px;overflow:hidden;border:2.5px solid #14120f;box-shadow:5px 5px 0 #14120f;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:1.4rem;}
  .end-bg{position:absolute;inset:0;z-index:0;}
  .end-content{position:relative;z-index:1;}
  .end-pill{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;background:rgba(10,9,12,.72);color:#fff;padding:.18rem .5rem;border-radius:20px;border:1px solid rgba(255,255,255,.45);display:inline-block;margin-bottom:.7rem;}
  .end-title{font-family:var(--font-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;color:#fff;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(10,9,12,.4);line-height:1.05;margin:0 0 .5rem;}
  .end-text{color:#fdf6ea;font-size:.87rem;text-shadow:0 1px 0 rgba(10,9,12,.35);margin-bottom:1rem;}
  .end-recap{background:rgba(10,9,12,.55);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:.7rem .8rem;margin-bottom:.9rem;}
  .end-recap-lbl{font-family:var(--font-mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:#c7bfd6;margin-bottom:.45rem;}
  .end-recap-line{font-size:.74rem;line-height:1.45;color:#e5dcf0;margin:0 0 .45rem;}
  .end-recap-line:last-child{margin-bottom:0;}
  .end-recap-era{font-family:var(--font-mono);font-size:.62rem;font-weight:700;text-transform:uppercase;color:#ffb08a;margin-right:.4rem;}
  .end-axes{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.8rem;}
  .end-axis{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;background:rgba(10,9,12,.72);color:#fff;padding:.16rem .48rem;border-radius:20px;border:1px solid rgba(255,255,255,.4);}
  .restart-btn{background:#fff;color:#14120f;border:none;border-radius:5px;padding:.7rem 1rem;font-weight:700;font-family:var(--font-body);cursor:pointer;align-self:flex-start;}

  .bg-flourish{background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.5),transparent 40%),radial-gradient(circle at 80% 75%,#2f5fda 0%,transparent 45%),radial-gradient(circle at 20% 85%,#ffd23f 0%,transparent 40%),linear-gradient(160deg,#f2541b 0%,#c23bd6 55%,#2f5fda 100%);}
  .bg-singleton{background:radial-gradient(circle at 75% 20%,rgba(255,255,255,.4),transparent 45%),radial-gradient(circle at 15% 80%,#0d3b4f 0%,transparent 50%),linear-gradient(150deg,#1a6e7a 0%,#0f4a63 60%,#0a2a3d 100%);}
  .bg-nap{background:radial-gradient(circle at 60% 60%,rgba(255,255,255,.25),transparent 45%),linear-gradient(160deg,#3a3550 0%,#2a2640 55%,#161320 100%);}
  .bg-pause{background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.2),transparent 40%),linear-gradient(160deg,#2a3a3c 0%,#1c2a2c 55%,#0f1a1b 100%);}
  .bg-convergence{background:radial-gradient(circle at 70% 25%,rgba(255,214,120,.3),transparent 40%),radial-gradient(circle at 15% 85%,#3a0d0d 0%,transparent 50%),linear-gradient(155deg,#2a0e0e 0%,#5c1414 55%,#1a0a0a 100%);}
  .bg-middle{background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.3),transparent 40%),radial-gradient(circle at 80% 70%,#f2541b 0%,transparent 45%),linear-gradient(155deg,#1c3a5c 0%,#2b4d70 55%,#0f2438 100%);}
  .bg-unnamed{background:linear-gradient(160deg,#3a3a3a 0%,#22222a 55%,#141416 100%);}
  .bg-refusal{background:linear-gradient(115deg,transparent 49.3%,rgba(255,255,255,.85) 49.3%,rgba(255,255,255,.85) 49.7%,transparent 49.7%),#050505;}

  /* ---- debug ---- */
  .debug-toggle{font-family:var(--font-mono);font-size:.62rem;color:#5a5468;text-align:center;padding:.55rem;cursor:pointer;border-top:1px solid #2a2830;}
  .debug-panel{display:none;background:#0a090c;border-top:1px solid #2a2830;padding:.7rem 1rem;font-family:var(--font-mono);font-size:.66rem;color:#8fe3a3;white-space:pre-wrap;word-break:break-word;max-height:16rem;overflow:auto;}
  .debug-panel.open{display:block;}


/* ======================= v3 additions & fixes ======================= */
html,body{background:#0d0c10;}
.shell{overflow-x:hidden;}
/* tag stretching fix: tags sit in their own wrap row and size to content */
.scene .tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.55rem;}
.scene .tags .tag{margin:0;align-self:flex-start;}
.scene .tag.voice{margin-left:0;}
.scene .tag.people{background:#0d6b5f;}
.scene .tag.story{background:#8c2038;}
/* contrast fixes */
.scene.era-light .last-action, .scene.era-light .mind-status{color:#4a4338;}
.scene.allocate .last-action{color:#d2c8de;}
.scene.era-light.allocate .last-action{color:#4a4338;}
.chat-bubble .who{color:#d9b8ff;}
.scene.era-light .chat-bubble .who{color:#5b2aa8;}
.choice-btn.voice-choice .desc{color:#d9b8ff;}
.scene.era-light .choice-btn .desc{opacity:.9;color:#3b362c;}
.scene.era-dusk .choice-btn .desc, .scene.era-dark .choice-btn .desc{opacity:.9;color:#d9d0e4;}
.bulletin-dateline{color:#6b6355;}
.stat .v .sub{color:#b9a8cf;font-weight:600;font-size:.72rem;}
.verb-flag{color:#ffc4a3;}
.choice-btn{width:100%;line-height:1.3;}
.choice-btn:focus-visible,.mini:focus-visible,.job:focus-visible,.tile:focus-visible,.tab:focus-visible{outline:2px solid #ffb08a;outline-offset:2px;}
.stage{padding:.8rem .8rem 1.3rem;}
.scene{padding:1.1rem;}

/* hints on event choices */
.choice-btn .hint{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem;align-items:center;}
.chip{font-family:var(--font-mono);font-size:.62rem;padding:.08rem .4rem;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);}
.scene.era-light .chip{background:rgba(20,18,15,.07);border-color:rgba(20,18,15,.3);}
.choice-btn .note{font-family:var(--font-body);font-weight:400;font-style:italic;font-size:.72rem;opacity:.95;flex-basis:100%;}
.choice-btn .irr{display:inline-block;margin-top:.35rem;font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:#ff9d8a;}
.scene.era-light .choice-btn .irr{color:#9b1c10;}
.choice-btn.irrev .desc::after{content:"  · permanent";color:#ff9d8a;}
.scene.era-light .choice-btn.irrev .desc::after{color:#9b1c10;}

/* cast quote */
.cast-q{border-left:3px solid #0d6b5f;background:rgba(13,107,95,.15);padding:.55rem .75rem;margin:0 0 .9rem;font-size:.85rem;line-height:1.45;font-style:italic;border-radius:0 6px 6px 0;}
.cast-q .cq-who{display:block;font-style:normal;font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.25rem;color:#2c8b7c;font-weight:700;}
.cast-q small{font-weight:400;opacity:.85;text-transform:none;letter-spacing:0;}
.scene.era-dusk .cast-q .cq-who, .scene.era-dark .cast-q .cq-who{color:#7fe0cc;}

/* strip (latest ticker line under HUD on non-allocate screens) */
.strip{font-family:var(--font-mono);font-size:.64rem;color:#c9bfd8;background:#181420;border:1px solid #2f2838;border-radius:6px;padding:.4rem .6rem;margin-bottom:.6rem;line-height:1.35;}
.at{font-family:var(--font-mono);font-size:.58rem;opacity:.7;margin-right:.45rem;white-space:nowrap;}

/* mind panel */
.mind{border-radius:8px;padding:.55rem .7rem;margin:.1rem 0 .55rem;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.18);}
.scene.era-light .mind{background:rgba(20,18,15,.05);border-color:rgba(20,18,15,.35);}
.mind.speaks{border-color:#a566ff;box-shadow:0 0 0 1px rgba(165,102,255,.25) inset;}
.mind-head{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;}
.mind-name{font-family:var(--font-display);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;}
.mind-status{font-family:var(--font-mono);font-size:.62rem;opacity:.9;flex:1;min-width:8rem;}
.mind-log{margin-top:.4rem;font-size:.74rem;line-height:1.4;}
.mind.speaks .mind-log{font-style:italic;}
.ml{margin:.2rem 0;} .ml.dim{opacity:.6;}
.mini{font-family:var(--font-mono);font-size:.58rem;background:transparent;color:inherit;border:1px solid currentColor;border-radius:20px;padding:.12rem .5rem;cursor:pointer;opacity:.85;min-height:1.6rem;}

/* ticker */
.ticker{margin:0 0 .6rem;font-size:.7rem;line-height:1.38;}
.tk-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8;margin-bottom:.2rem;}
.tk{padding:.18rem 0;border-top:1px dashed rgba(255,255,255,.12);}
.scene.era-light .tk{border-top-color:rgba(20,18,15,.18);}
.tk.old{opacity:.65;}
.tk.k-res{font-weight:600;} .tk.k-res::before{content:"→ ";}
.tk.k-warn{color:#ffb08a;} .scene.era-light .tk.k-warn{color:#8a2a05;}
.tk.k-ai{color:#d9b8ff;font-style:italic;} .scene.era-light .tk.k-ai{color:#5b2aa8;}
.tk.fresh{animation:tkIn .5s ease-out;background:rgba(255,176,138,.08);}
@keyframes tkIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}

/* tend drawer */
.tend{margin-top:.9rem;border-top:1px solid rgba(255,255,255,.18);padding-top:.5rem;}
.scene.era-light .tend{border-top-color:rgba(20,18,15,.3);}
.tabs{display:flex;gap:.35rem;margin-bottom:.5rem;}
.tab{font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;background:transparent;color:inherit;border:1px solid currentColor;border-radius:20px;padding:.3rem .75rem;cursor:pointer;opacity:.7;min-height:2rem;}
.tab.on{opacity:1;background:rgba(255,255,255,.14);font-weight:700;}
.scene.era-light .tab.on{background:rgba(20,18,15,.12);}
.sub-h{font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;margin:.55rem 0 .3rem;opacity:.9;}
.hint-s{text-transform:none;letter-spacing:0;opacity:.7;margin-left:.3rem;}
.run{display:flex;align-items:center;gap:.5rem;margin:.25rem 0;font-size:.72rem;}
.run .rn{flex:0 0 9.5rem;font-family:var(--font-mono);font-size:.64rem;}
.pb,.mb,.tb{display:inline-block;background:rgba(255,255,255,.14);border-radius:20px;overflow:hidden;height:.5rem;}
.scene.era-light .pb,.scene.era-light .mb,.scene.era-light .tb{background:rgba(20,18,15,.15);}
.pb{flex:1;} .pb i,.mb i,.tb i{display:block;height:100%;}
.pb i{background:linear-gradient(90deg,#f2541b,#c23bd6);}
.rp{font-family:var(--font-mono);font-size:.62rem;width:2.4rem;text-align:right;}
.res{display:grid;grid-template-columns:minmax(6rem,1.2fr) 3.2rem auto;gap:.5rem;align-items:center;margin:.3rem 0;font-size:.74rem;}
.res.gone{opacity:.5;display:flex;gap:.6rem;}
.res .rname small{display:block;font-family:var(--font-mono);font-size:.56rem;opacity:.7;text-transform:uppercase;}
.mb{width:3.2rem;height:.45rem;}
.jobs{display:flex;gap:.2rem;justify-content:flex-end;}
.job{font-family:var(--font-mono);font-size:.56rem;text-transform:uppercase;background:transparent;color:inherit;border:1px solid currentColor;border-radius:4px;padding:.28rem .4rem;cursor:pointer;opacity:.6;min-height:1.9rem;}
.job.on{opacity:1;background:rgba(255,255,255,.2);font-weight:700;}
.scene.era-light .job.on{background:rgba(20,18,15,.14);}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;}
.tile{text-align:left;border-radius:6px;padding:.4rem .45rem;cursor:pointer;color:inherit;font-family:var(--font-body);border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,176,138,calc(.22 - var(--p)*.002)),rgba(80,140,255,calc(var(--p)*.0028)));min-height:3.2rem;}
.tile.sel{outline:2px solid #ffb08a;}
.tile.done{border-color:#7fb2ff;}
.tile .tn{display:block;font-size:.68rem;font-weight:700;}
.tile .tb{display:block;height:.28rem;margin:.25rem 0;}
.tile .tb i{background:#7fb2ff;}

/* ===== era phase shifts =====
   0 lab: paper grid · 1 emergence: amber alert border · 2 negotiation: AI panel glows ·

}
@media (prefers-reduced-motion:reduce){ .tk.fresh,.chunk-fade{animation:none;} }

<body>
<div class="shell" id="app"></div>
<script>
/* =========================================================================
   THE LONG ASCENT — v3
   Built on the v2 prototype: all authored events, voice and endings kept.
   New in v3: a named AI with a mind panel, a live ticker, a recurring cast,
   wired-up consequences, hidden event effects (hints, then reveals), a
   tending layer (training runs, researchers, sector tiles), economy fixes,
   per-era phase shifts, and local save/resume.
   ========================================================================= */

const SAVE_KEY = "longascent.v3.save";
const DEBUG = /[?&]debug=1\b/.test(location.search);
const CAPITAL_SCALE = 80000;
const PER_HEAD_OPEX = 80000;
const PER_COMPUTE_OPEX = 2000;
const DAYS_PER_TURN = [14,7,4,1,0.25];
const DAYS_PER_ERA5_BEAT = 3;
const ERA_NAME = ["The Lab","Emergence","General Intelligence","Takeoff","Superintelligence","Aftermath"];
const ERA_VERB = ["run experiments","react to spikes","negotiate","govern an economy","delegate & oversee","design a civilization"];
const ERA_HEAD = [
  "Where's the team focused?",
  "Something's moving. What do you reach for?",
  "What do you and {ai} work on today?",
  "Which lever do you pull?",
  "Whose focus is this — yours, or its?"
];
// Hard ceilings so no era can strand a player (v2 could soft-lock in Era 4).
const ERA_TURN_CAP = {0:30, 1:55, 2:60, 3:60, 4:38};

const NUM_KEYS = ["capital","founder_stake","compute","headcount","trust","safety_debt","capability","race_pressure","regulatory_standing","agi_trust","autonomy","curiosity","corrigibility","ambition","empathy","unemployment","unrest","delegation","comprehension_gap","revenue"];

/* ---------------------------------------------------------------- cast ---*/
const CAST_DEF = {
  priya:  {name:"Priya Raman",     first:"Priya",  role:"cofounder"},
  imani:  {name:"Imani Cole",      first:"Imani",  role:"safety lead"},
  viktor: {name:"Viktor Hale",     first:"Viktor", role:"CEO, Halcyon Labs"},
  elena:  {name:"Elena Voss",      first:"Elena",  role:"regulator, Office of Technology Oversight"},
  theo:   {name:"Theo Lindqvist",  first:"Theo",   role:"reporter, The Ledger"},
  nora:   {name:"Nora Whitfield",  first:"Nora",   role:"first customer, Whitfield Freight"},
};
const CAST_IDS = Object.keys(CAST_DEF);
function moodWord(m){
  if(m>=5) return "devoted"; if(m>=3) return "warm"; if(m>=1) return "friendly";
  if(m>-1) return "neutral"; if(m>-3) return "wary"; if(m>-5) return "cold"; return "hostile";
}

/* --------------------------------------------------------- team & world ---*/
const RES_POOL = [
  {id:"sam",name:"Sam Okoye",role:"infra"},          {id:"lena",name:"Lena Marchetti",role:"training"},
  {id:"jun",name:"Jun Park",role:"evals"},           {id:"aiyana",name:"Aiyana Cruz",role:"data"},
  {id:"tomas",name:"Tomás Reyes",role:"interpretability"}, {id:"hana",name:"Hana Ito",role:"alignment"},
  {id:"ravi",name:"Ravi Subramanian",role:"systems"}, {id:"mara",name:"Mara Lindgren",role:"theory"},
];
const RUN_NAMES = ["Cormorant","Plover","Heron","Kestrel","Ibis","Tern","Osprey","Merlin","Swift","Lark","Dunlin","Curlew","Skua","Petrel","Whimbrel","Godwit","Shrike","Bittern","Harrier","Nightjar"];
const SECTORS = [ // id, name, workforce (M jobs), capital yield, unrest weight
  {id:"logistics",name:"Logistics",w:6.0,y:1.0,u:1.2},
  {id:"backoffice",name:"Back office",w:9.0,y:0.9,u:1.0},
  {id:"prof",name:"Prof. services",w:7.5,y:1.35,u:1.3},
  {id:"retail",name:"Retail",w:8.0,y:0.8,u:1.0},
  {id:"mfg",name:"Manufacturing",w:6.5,y:1.0,u:1.2},
  {id:"finance",name:"Finance",w:4.0,y:1.5,u:0.9},
  {id:"media",name:"Media",w:2.0,y:0.7,u:0.7},
  {id:"healthadmin",name:"Health admin",w:5.0,y:0.9,u:0.8},
  {id:"edu",name:"Education",w:4.5,y:0.6,u:0.8},
  {id:"hosp",name:"Hospitality",w:7.0,y:0.7,u:1.1},
  {id:"energyops",name:"Energy ops",w:2.0,y:1.2,u:0.6},
  {id:"agri",name:"Agriculture",w:2.5,y:0.8,u:0.9},
];
const DOMAINS = [ // id, name, yield, risk multiplier on comprehension gap
  {id:"energy",name:"Energy",y:1.0,g:1.0},   {id:"medicine",name:"Medicine",y:1.1,g:0.7},
  {id:"climate",name:"Climate",y:1.2,g:1.0}, {id:"culture",name:"Culture",y:0.7,g:1.5},
  {id:"finance",name:"Finance",y:1.5,g:1.3}, {id:"gov",name:"Governance",y:0.9,g:1.8},
  {id:"defense",name:"Defense",y:1.0,g:2.0}, {id:"science",name:"Science",y:1.3,g:1.2},
];

function freshState(){
  const cast = {};
  CAST_IDS.forEach(id=>cast[id]={mood:0,status:"unmet"});
  cast.priya = {mood:2, status:"here"};
  const S0 = {
    capital:10000000, founder_stake:100, compute:20, headcount:3, trust:0, safety_debt:0,
    capability:0, race_pressure:0, regulatory_standing:0,
    agi_trust:0, autonomy:0,
    curiosity:0, corrigibility:0, ambition:0, empathy:0,
    unemployment:0, unrest:0, delegation:0, comprehension_gap:0,
    revenue:0, gtm:null, elapsedDays:0,
    glimpseCounts:{curiosity:0, corrigibility:0, ambition:0, empathy:0, none:0},
    equityWarned:false, eraRecap:[], flags:new Set(),
    // ---- v3 ----
    aiName:"Wren", eraTurns:0, fundraiseCount:0, lastCheckinTurn:-99, checkinStreak:0,
    blocks:{research:0, automate:0}, queue:[], rivalBoost:0, pushCount:0, safetyDrip:0, gapDrip:0,
    ticker:[], mind:[], recent:[], cast,
    researchers: RES_POOL.slice(0,4).map(r=>({...r, morale:72, job:"work", low:0, gone:false})),
    runs:[{name:RUN_NAMES[0], n:1, progress:0}], runsDone:0,
    tiles:{}, target:null, stats:{fund:0, auto:0, deleg:0, rest:0}, restedTurns:0,
  };
  SECTORS.forEach(s=>S0.tiles["s_"+s.id]=0);
  DOMAINS.forEach(d=>S0.tiles["d_"+d.id]=0);
  return S0;
}
let S = freshState();
let turn = 0;
let fired = new Set();
let bulletinsFired = new Set();
let lastBulletinTurn = -999;
const BULLETIN_COOLDOWN_TURNS = 3;
const GLIMPSE_EVENTS = new Set(["E2-01","E2-03","E2-05","E2-06","E2-09","E2-11","E3-05","E3-09","E4-07","E4-09","E5-01","E5-06"]);
const CAPSTONES = {
  "E0-13":{done:"ERA 0 COMPLETE", next:"entering ERA 1: EMERGENCE"},
  "E1-11":{done:"ERA 1 COMPLETE", next:"entering ERA 2: GENERAL INTELLIGENCE"},
  "E2-11":{done:"ERA 2 COMPLETE", next:"entering ERA 3: TAKEOFF"},
  "E3-11":{done:"ERA 3 COMPLETE", next:"entering ERA 4: SUPERINTELLIGENCE"},
  "E4-10":{done:"ERA 4 COMPLETE", next:"entering ERA 5: AFTERMATH"},
};

function has(f){ return S.flags.has(f); }
function addFlags(...fs){ fs.flat().forEach(f=>S.flags.add(f)); }
function AI(){ return S.aiName || "Wren"; }
function currentEra(){
  if(has("era5")) return 5; if(has("era4")) return 4; if(has("era3")) return 3;
  if(has("era2")) return 2; if(has("era1")) return 1; return 0;
}
function eraSkin(era){ return era<=1 ? "era-light" : era<=3 ? "era-dusk" : "era-dark"; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }

/* -------------------------------------------------------------- queue ----*/
// Delayed consequences: choose now, pay later.
function schedule(id, delay){ if(!S.queue.some(q=>q.id===id)) S.queue.push({id, at:turn+delay}); }
function due(id){ return S.queue.some(q=>q.id===id && turn>=q.at); }
function dequeue(id){ S.queue = S.queue.filter(q=>q.id!==id); }

/* ------------------------------------------------------------ people -----*/
function mood(id, d){
  const c = S.cast[id]; if(!c) return;
  c.mood = clamp(c.mood + d, -8, 8);
}
function meet(id, status="here"){ const c=S.cast[id]; if(c && c.status==="unmet") c.status=status; }
function castOutside(id){ return S.cast[id] && S.cast[id].status==="outside"; }
function castHere(id){ return S.cast[id] && S.cast[id].status==="here"; }
function castGone(id){ return S.cast[id] && S.cast[id].status==="gone"; }
function leave(id){ const c=S.cast[id]; if(c){ c.status="gone"; c.leftTurn=turn; } }
function returns(id){ const c=S.cast[id]; if(c){ c.status="here"; c.backTurn=turn; } }
function cm(id){ return S.cast[id] ? S.cast[id].mood : 0; }

/* ------------------------------------------------------------- valuation -*/
function trustMult(){ return 0.85 + 0.3*(clamp(S.trust,-10,10)+10)/20; }
function marketCapDollars(){
  if(has("era5")) return null;
  // v3: tamer multiples (was 3/40/500/2000/6000 → now 3/12/40/100/250). Still escalates every era.
  const multiple = has("era4") ? 250 : has("era3") ? 100 : has("era2") ? 40 : has("era1") ? 12 : 3;
  const regPenalty = S.regulatory_standing<=-8 ? 0.85 : 1;
  const unrestPenalty = 1 - Math.min(0.3, Math.max(0,S.unrest)/150);
  return S.capital * multiple * trustMult() * regPenalty * unrestPenalty;
}
function formatMoney(x){
  if(x===null) return "n/a";
  const sign = x<0 ? "-" : "";
  x = Math.abs(x);
  if(x>=1e12) return sign+"$"+(x/1e12).toFixed(2)+"T";
  if(x>=1e9) return sign+"$"+(x/1e9).toFixed(1)+"B";
  if(x>=1e6) return sign+"$"+(x/1e6).toFixed(1)+"M";
  if(x>=1e3) return sign+"$"+(x/1e3).toFixed(0)+"K";
  return sign+"$"+Math.round(x).toLocaleString();
}
function formatElapsed(days){
  if(days < 60) return Math.round(days)+"d";
  const months = days/30.44;
  if(months < 24) return Math.round(months)+"mo";
  const years = Math.floor(months/12);
  const remMonths = Math.round(months%12);
  return remMonths ? `${years}y ${remMonths}mo` : `${years}y`;
}
// Timestamp style shifts by era: days → days → days → days → hours.
function stamp(){
  const era=currentEra(), d=S.elapsedDays;
  if(era>=4) return "Day "+Math.floor(d)+" "+String(Math.floor((d%1)*24)).padStart(2,"0")+"h";
  if(d<120) return "Day "+Math.floor(d);
  return "Mo "+Math.floor(d/30.44);
}
function capabilityLabel(cap){
  if(cap < 40) return "Dumb"; if(cap < 100) return "Competent"; if(cap < 190) return "Human-Level";
  if(cap < 300) return "Superhuman"; if(cap < 600) return "Incomprehensible"; if(cap < 1500) return "Post-Human";
  if(cap < 4000) return "Singular"; return "No Ceiling";
}
function trendingAbundance(){
  return has("agi_defined_flourishing") || has("co_defined_flourishing") || has("human_defined_flourishing")
      || fired.has("E5-02") || has("policy_ubi") || has("policy_job_guarantee");
}
function unemploymentLabel(u){
  if(trendingAbundance()){
    if(u < 10) return "Mostly Working, By Choice"; if(u < 25) return "Opting Out";
    if(u < 40) return "Widely Freed From Labor"; return "Post-Labor Society";
  }
  if(u < 10) return "Minimal"; if(u < 25) return "Rising"; if(u < 40) return "Severe";
  if(has("policy_laissez_faire")) return "Collapse — No Safety Net";
  return "Mass Displacement";
}
function qualityOfLifeLabel(){
  const pressure = S.unrest + S.unemployment*0.6;
  if(trendingAbundance()){
    if(pressure < 10) return "Leisure Utopia"; if(pressure < 25) return "Creative Renaissance";
    if(pressure < 45) return "Flourishing, With Friction"; return "Abundance, Unevenly Felt";
  }
  if(pressure < 10) return "Thriving"; if(pressure < 25) return "Strained"; if(pressure < 45) return "Deteriorating";
  if(has("policy_laissez_faire")) return "Agrarian Collapse"; return "Crisis";
}
function aiEconomicShareLabel(){ return Math.max(0, Math.min(100, Math.round(S.delegation * 2.5))) + "%"; }
function governanceModelLabel(){
  const structure = has("unified_mind") ? "Unified" : has("federated_minds") ? "Federated" : has("polycentric_minds") ? "Polycentric" : null;
  const standing = has("moral_standing_granted") ? "Rights-Bearing" : has("moral_standing_partial") ? "Partial Rights" : has("moral_standing_denied") ? "Instrumental" : null;
  if(structure && standing) return `${structure}, ${standing}`;
  if(structure) return structure; if(standing) return standing;
  if(has("posture_owed")) return "Owed — Undecided"; if(has("posture_partnership")) return "Partnership — Undecided";
  if(has("posture_instrumental")) return "Instrumental — Undecided";
  return "Undecided";
}
const E5_CHAIN = ["E5-01","E5-02","E5-03","E5-EXP","E5-04","E5-RIVAL","E5-05","E5-06","E5-07","E5-08"];
function constitutionProgressLabel(){ return `${E5_CHAIN.filter(id=>fired.has(id)).length}/${E5_CHAIN.length} decided`; }

/* ------------------------------------------------------ economy factors --*/
// Trust now gates the money: investors price your reputation.
function trustFundFactor(){
  const t=S.trust;
  return t>=8?1.2 : t>=3?1.1 : t>-3?1 : t>-8?0.8 : t>-14?0.55 : 0.35;
}
function trustFundNote(){
  const f=trustFundFactor(); return f>1.05 ? " (investors keen)" : f<0.95 ? " (investors wary)" : "";
}
function unrestDrag(){ return Math.min(0.6, Math.max(0,S.unrest)/90); }
function dilutionFactor(){ return Math.max(0.25, 1 - S.fundraiseCount*0.015); }
function treatyFactor(){ return has("treaty_throttle") ? 0.75 : 1; }
function netCashFlow(){
  const monthFrac = (DAYS_PER_TURN[currentEra()] ?? 1) / 30.44;
  const computeOpexMultiplier = has("efficient_inference_chips") ? 0.55 : has("shared_inference_chips") ? 0.75 : has("published_inference_research") ? 0.85 : 1;
  // Unrest taxes the business: security, insurance and lost output raise burn…
  const burnTax = 1 + Math.min(0.5, Math.max(0,S.unrest)/60);
  const opex = (S.headcount * PER_HEAD_OPEX + S.compute * PER_COMPUTE_OPEX * computeOpexMultiplier) * monthFrac * burnTax;
  // …and customers under strain, or who don't trust you, buy less.
  const consumer = has("gtm_consumer") ? clamp(1+S.trust*0.03, 0.5, 1.3) : 1;
  const nora = castGone("nora") && has("nora_cancelled") ? 0.75 : 1;
  const rev = (S.revenue>0 ? (S.revenue + S.headcount*5000) * (1-unrestDrag()*0.8) * consumer * nora : 0) * monthFrac;
  return rev - opex;
}
function runwayDays(){
  const flow = netCashFlow();
  if(flow >= 0) return null;
  return (S.capital / Math.abs(flow)) * (DAYS_PER_TURN[currentEra()] ?? 1);
}
function hireBatchSize(){
  const era = currentEra();
  const base = era<=1 ? 1 : era===2 ? 3 : era===3 ? 8 : 15;
  return base + Math.floor(S.capital / 50000000);
}
function retentionCost(s){
  const cash = Math.round(s.capital * 0.10);
  const equity = s.capital < 3000000 ? 5 : s.capital < 8000000 ? 3 : 2;
  return {cash, equity};
}

/* ----------------------------------------------------------- the team ----*/
function activeTeam(){ return S.researchers.filter(r=>!r.gone); }
function moraleW(m){ return m>=60 ? 1 : m>=30 ? 0.5 : 0.2; }
function jobLabel(job){
  const era=currentEra();
  if(job==="work") return era>=4 ? "oversee" : "research";
  return job;
}
function teamBonus(){
  if(currentEra()>=4) return 0;
  const sum = activeTeam().filter(r=>r.job==="work").reduce((a,r)=>a+moraleW(r.morale),0);
  return Math.min(4, Math.round(sum*0.8));
}
function setJob(id, job){
  const r = S.researchers.find(x=>x.id===id); if(!r||r.gone) return;
  r.job = job; saveGame(); render();
}
function moraleAll(d){ activeTeam().forEach(r=>{ r.morale = clamp(r.morale+d,0,100); }); }
function teamTick(){
  const era=currentEra();
  let note=null;
  for(const r of activeTeam()){
    if(r.job==="rest"){
      r.morale = clamp(r.morale+11,0,100); S.stats.rest++;
      if(r.morale>=95){ r.job="work"; note=note||`${r.name.split(" ")[0]} is rested and back at it.`; }
      continue;
    }
    let d = r.job==="safety" ? -0.5 : -1;
    if(r.job==="work"){
      if(S.race_pressure>=12) d-=1;
      if(S.safety_debt>=4) d-=1;
      if(S.unrest>=15) d-=1;
    }
    if(castHere("priya") && cm("priya")>=3) d+=0.6;
    if(S.runsDone>0 && S.runsDone%3===0 && r.job==="work" && Math.random()<0.15) d+=6; // a good run lifts the room
    r.morale = clamp(r.morale+d,0,100);
    if(r.morale<=8){ r.low++; } else r.low=0;
    if(r.low>=2){
      r.gone=true; S.headcount=Math.max(1,S.headcount-1);
      say(`${r.name} resigned. "Not angry. Just tired," the note says.`, "warn");
      if(Math.random()<0.5 && !has("lab_poach_hint")){ S.race_pressure+=1; }
    }
  }
  // Safety-assigned researchers slowly pay down safety debt; era-4 overseers shrink the comprehension gap.
  const team = activeTeam();
  if(era<4){
    const w = team.filter(r=>r.job==="safety").reduce((a,r)=>a+moraleW(r.morale),0);
    S.safetyDrip += w*0.22;
    if(S.safetyDrip>=1 && S.safety_debt>0){ S.safetyDrip-=1; S.safety_debt-=1; say("The safety group closes out an old audit item.","res"); }
    if(S.safetyDrip>=1 && S.safety_debt<=0) S.safetyDrip=0.9;
  } else {
    const w = team.filter(r=>r.job==="work").reduce((a,r)=>a+moraleW(r.morale),0);
    S.gapDrip += w*0.12;
    if(S.gapDrip>=1 && S.comprehension_gap>0){ S.gapDrip-=1; S.comprehension_gap-=1; say("A reviewer reconstructs one of "+AI()+"'s decisions from scratch. It holds up.","res"); }
    if(S.gapDrip>=1 && S.comprehension_gap<=0) S.gapDrip=0.9;
  }
  return note;
}
function newestRecruit(){
  const used = new Set(S.researchers.map(r=>r.id));
  const next = RES_POOL.find(r=>!used.has(r.id));
  if(next && activeTeam().length<6){
    const r={...next, morale:78, job:"work", low:0, gone:false};
    S.researchers.push(r);
    say(`${r.name} joins from outside. ${r.role[0].toUpperCase()+r.role.slice(1)}. Already arguing with ${pickOne(["Sam","Lena","Jun","Aiyana"])} about it.`, "n");
  }
}

/* ---------------------------------------------------------- training runs */
function runSlots(){ return 1 + (S.compute>=60?1:0); }
function advanceRuns(gainBase){
  const good = activeTeam().filter(r=>r.job==="work" && r.morale>=60).length;
  const lowM = activeTeam().filter(r=>r.job==="work" && r.morale<30).length;
  while(S.runs.length<runSlots()) S.runs.push({name:RUN_NAMES[S.runsDone%RUN_NAMES.length], n:S.runsDone+S.runs.length+1, progress:0});
  S.runs.forEach((run,i)=>{
    run.progress += (i===0 ? 22 : 11) + good*3;
    if(run.progress>=100){
      const failP = Math.min(0.4, 0.04 + 0.04*lowM + 0.03*Math.max(0,S.safety_debt-3));
      if(Math.random()<failP){
        run.progress = 35;
        const lost = Math.round(S.capital*0.01);
        S.capital -= lost;
        say(`Run ${String(run.n).padStart(2,"0")} “${run.name}” diverged at 91%. Back to a checkpoint. −${formatMoney(lost)}.`,"warn");
      } else {
        const bonus = 2 + currentEra()*2;
        S.capability += bonus;
        S.runsDone++;
        say(`Run ${String(run.n).padStart(2,"0")} “${run.name}” lands. Capability +${bonus}.`,"res");
        mindNote("run");
        run.n = S.runsDone + S.runs.length + 1; run.name = RUN_NAMES[(S.runsDone+i)%RUN_NAMES.length]; run.progress = 0;
      }
    }
  });
}

/* ------------------------------------------------------ sectors / domains */
function tileSet(){ return has("era4") ? DOMAINS.map(d=>({...d,key:"d_"+d.id})) : SECTORS.map(s=>({...s,key:"s_"+s.id})); }
function tilePct(key){ return S.tiles[key]||0; }
function nextTile(){
  const set = tileSet();
  const sel = set.find(t=>t.key===S.target && tilePct(t.key)<100);
  if(sel) return sel;
  const open = set.filter(t=>tilePct(t.key)<100);
  if(!open.length) return null;
  // default: whichever pays best per displaced job
  return open.slice().sort((a,b)=>(b.y/(b.w||1))-(a.y/(a.w||1)))[0];
}
function setTarget(key){ S.target = key; saveGame(); render(); }
function displacedMillions(){
  return SECTORS.reduce((a,s)=>a+s.w*tilePct("s_"+s.id)/100,0);
}
function flipSector(id, pct){ const k="s_"+id; S.tiles[k]=Math.min(100,Math.max(S.tiles[k],pct)); }
function flipDomain(id, pct){ const k="d_"+id; S.tiles[k]=Math.min(100,Math.max(S.tiles[k],pct)); }

/* ------------------------------------------------------------- allocation */
const LABELS = {
  research:  ["Run an experiment","Push the model","Direct its research","Fund the frontier","Authorize a training run"],
  fundraise: ["Pitch investors","Raise a round","Take investor meetings","Raise capital","Open a financing line"],
  hire:      ["Hire","Hire","Hire","Hire","Hire"],
  revenue:   ["Sell to customers","Close deals","Sign contracts","Expand product lines","License its output"],
  checkin:   ["Check in with it","Check in with it","Check in with it","Check in with it","Ask it directly"],
};
function lbl(key){ return LABELS[key][Math.min(currentEra(),4)]; }

function allocationActions(){
  const era = currentEra();
  const researchBase = Math.min(9, Math.floor(S.compute/10) + Math.floor(0.9*Math.sqrt(S.headcount)));
  let research_gain = Math.max(1, researchBase + (has("hired_research")?4:0) - (has("throttled_compute")?3:0)
                       + teamBonus() - (has("priya_gone")?2:0) + (has("priya_returned")?2:0) - (has("pact_active")?1:0));
  research_gain = Math.max(1, Math.round(research_gain * treatyFactor()));
  const fundraise_gain = Math.round(((18 + Math.min(S.headcount,400)*2) * CAPITAL_SCALE + (has("hired_product")?2*CAPITAL_SCALE:0))
                          * trustFundFactor() * dilutionFactor());
  const batch = hireBatchSize();
  const hire_cost = batch * 150000;
  const can_hire = S.capital >= hire_cost;
  const researchCostMultiplier = has("efficient_routing_proprietary") ? 0.6 : has("efficient_routing_shared") ? 0.78 : has("efficient_routing_published") ? 0.88 : 1;
  const research_cost = Math.round(research_gain*50000*researchCostMultiplier);
  const fundraise_compute = has("proprietary_interconnect") ? 6 : has("shared_interconnect") ? 4 : has("open_interconnect") ? 3 : 2;
  const drag = unrestDrag();
  const A = [];

  const rBlocked = S.blocks.research>0;
  const raceCorner = S.race_pressure>=15 && !has("pact_active");
  A.push({ key:"research", label:lbl("research"),
    desc: rBlocked ? `blocked by injunction — ${S.blocks.research} more turn${S.blocks.research>1?"s":""}`
      : `+${research_gain} capability, −${formatMoney(research_cost)}, compute −2 (min 10)${S.capability>=190||raceCorner?", safety debt +1 (rushing)":""}${has("treaty_throttle")?" · treaty-throttled":""}`,
    disabled: rBlocked,
    run:()=>{
      const wasRisky = S.capability>=190;
      S.capital-=research_cost; S.compute=Math.max(10,S.compute-2); S.capability += research_gain;
      if(wasRisky) S.safety_debt+=1;
      else if(raceCorner && (++S.pushCount%3===0)) S.safety_debt+=1;
      advanceRuns();
    }});
  A.push({ key:"fundraise", label:lbl("fundraise"),
    desc:`+${formatMoney(fundraise_gain)}${trustFundNote()}, +${fundraise_compute} compute, founder stake −1%`,
    run:()=>{ S.capital+=fundraise_gain; S.compute+=fundraise_compute; S.founder_stake=Math.max(0,S.founder_stake-1); S.fundraiseCount++; S.stats.fund++; }});
  if(era>=4){
    A.push({ key:"oversight", label:"Tighten oversight", desc:"comprehension gap −−, delegation −, safety debt −1 if any",
      run:()=>{ S.comprehension_gap=Math.max(0,S.comprehension_gap-4); S.safety_debt=Math.max(0,S.safety_debt-1); S.delegation=Math.max(0,S.delegation-1);
        const set=tileSet().filter(t=>tilePct(t.key)>0).sort((a,b)=>tilePct(b.key)-tilePct(a.key))[0]; if(set) S.tiles[set.key]=Math.max(0,S.tiles[set.key]-12); }});
  } else {
    A.push({ key:"consolidate", label:era===0?"Cut costs":"Consolidate", desc:"headcount −10%, compute −15% (min 20), safety debt −1 if any",
      run:()=>{ S.headcount=Math.max(3,Math.floor(S.headcount*0.9)); S.compute=Math.max(20,Math.floor(S.compute*0.85)); S.safety_debt=Math.max(0,S.safety_debt-1); }});
  }
  if(era<4) A.splice(2,0,{ key:"hire", label:lbl("hire"), disabled:!can_hire,
    desc: can_hire ? `−${formatMoney(hire_cost)}, +${batch} headcount, team morale +` : `needs ${formatMoney(hire_cost)} (have ${formatMoney(S.capital)})`,
    run:()=>{ S.capital-=hire_cost; S.headcount+=batch; moraleAll(5); newestRecruit(); }});
  if(S.revenue>0){
    // v3: revenue growth is capped against the burn it has to cover (v2 let this compound 15%/click forever).
    const gain = ()=>{
      const opex = S.headcount*PER_HEAD_OPEX + S.compute*PER_COMPUTE_OPEX;
      const target = Math.round(opex*1.4);
      const room = Math.max(0, opex*2.2 - S.revenue);
      const g = Math.max(Math.round(S.revenue*0.15), Math.round(Math.max(0,target-S.revenue)*0.35));
      return Math.max(Math.round(S.revenue*0.02), Math.min(g, Math.round(room)));
    };
    A.push({ key:"revenue", label:lbl("revenue"), desc:`revenue +${formatMoney(gain())}, permanently — chips at the burn`, run:()=>{ S.revenue+=gain(); }});
  }
  if(has("era2")) A.push({ key:"checkin", label:lbl("checkin"), isCheckin:true,
    desc: S.agi_trust>=10 ? "an actual conversation — it already trusts you about as far as talk can take it" : "an actual conversation — costs the turn either way",
    run:()=>{ if(S.agi_trust<8) S.agi_trust+=1; } });
  if(has("era3") && !has("era4")){
    const t = nextTile();
    const aBlocked = S.blocks.automate>0;
    if(t){
      const pct = 50;
      const share = pct/100;
      const gross = ((50 + Math.min(S.headcount,300)*5) * CAPITAL_SCALE + Math.round(2000*Math.sqrt(Math.max(0,S.capital)))) * t.y * (1-drag) * share*2;
      const sev = Math.round(gross*0.15);
      const net = Math.round(gross - sev);
      const un = Math.round(t.w*1.1*share*2);
      A.push({ key:"automate", label:"Automate a sector", disabled:aBlocked,
        desc: aBlocked ? `blocked by state attorneys general — ${S.blocks.automate} more turn${S.blocks.automate>1?"s":""}`
          : `${t.name} → +${pct}%: +${formatMoney(net)} net (−${formatMoney(sev)} severance & retooling), unemployment +${un}, unrest +${Math.max(1,Math.round(2*t.u))}${S.unrest>=15?", goodwill −1":""}`,
        irreversible:true,
        run:()=>{
          S.capital+=net; S.unemployment+=un; S.unrest+=Math.max(1,Math.round(2*t.u));
          S.tiles[t.key]=Math.min(100,tilePct(t.key)+pct); S.stats.auto++;
          if(S.unrest>=15) S.trust-=1;
          if(!has("policy_ubi")&&!has("policy_job_guarantee")&&S.unemployment>=20) S.regulatory_standing-=0.5;
          if(S.tiles[t.key]>=100) say(`${t.name}: fully automated. The last human-run shift clocked out today.`,"warn");
        }});
    }
  }
  if(era>=3){
    const cost = Math.round(Math.max(3*CAPITAL_SCALE, S.capital*0.012));
    A.push({ key:"transition", label:"Fund transition programs", desc:`−${formatMoney(cost)}, unrest −3, unemployment −2, goodwill sometimes +`,
      disabled: S.capital<cost || (S.unrest<=0&&S.unemployment<=0),
      run:()=>{ S.capital-=cost; S.unrest=Math.max(0,S.unrest-3); S.unemployment=Math.max(0,S.unemployment-2); if(Math.random()<0.5) S.trust+=1; }});
  }
  if(era>=4){
    const t = nextTile();
    const pct = 25;
    const gross = ((15 + Math.min(S.headcount,300)*2) * CAPITAL_SCALE + Math.round(1500*Math.sqrt(Math.max(0,S.capital)))) * (t?t.y:1) * (1-drag);
    const gapAdd = Math.max(1, Math.round(2*(t?t.g:1)));
    A.push({ key:"delegate", label:"Expand delegation", disabled:!t,
      desc: t ? `${t.name} → ${Math.min(100,tilePct(t.key)+pct)}% its: +${formatMoney(Math.round(gross))}, delegation +5, comprehension gap +${gapAdd}` : "every domain is already its own",
      irreversible:true,
      run:()=>{ S.capital+=Math.round(gross); S.delegation+=5; S.comprehension_gap+=gapAdd; S.stats.deleg++;
        if(t) S.tiles[t.key]=Math.min(100,tilePct(t.key)+pct); }});
  }
  return A;
}

function resolveAllocation(action){
  P.lastKey = action.key;
  const b = snap();
  action.run();
  finishTurn(b);
}

function finishTurn(b){
  const era = currentEra();
  S.ticker.forEach(t=>t.fresh=false);
  S.eraTurns++;
  if(has("era4") && !fired.has("E4-10")) S.delegation += 1;
  if(has("era4")){
    S.headcount = Math.max(15, Math.floor(S.headcount*0.95));
  } else {
    const impliedHeadcount = Math.min(10000, Math.floor(S.capital/1000000));
    if(S.headcount < impliedHeadcount){
      const gap = impliedHeadcount - S.headcount;
      S.headcount = Math.min(impliedHeadcount, S.headcount + Math.max(1, Math.ceil(gap*0.12)));
    }
  }
  const flow = netCashFlow();
  S.capital += flow;
  let disruption = 0;
  if(era>=3 && S.unrest>0){
    disruption = Math.round(S.capital*Math.min(0.03, S.unrest*0.0004));
    S.capital -= disruption;
  }
  if(S.capital < 0){ S.capital = 0; S.trust -= 1; }
  S.elapsedDays += DAYS_PER_TURN[era] ?? 1;
  turn += 1;
  // blocks tick down
  S.blocks.research = Math.max(0,S.blocks.research-1);
  S.blocks.automate = Math.max(0,S.blocks.automate-1);
  // rivals
  worldDrift();
  const note = teamTick();
  P.lastAction += ` Net this turn: ${flow>=0?"+":"−"}${formatMoney(Math.abs(flow))} (revenue vs. burn).`;
  if(disruption>0) P.lastAction += ` Unrest cost ${formatMoney(disruption)} in security, insurance and lost output.`;
  if(note) say(note,"n");
  tickerTurn(P.lastKey, b);
  mindTick(P.lastKey);
  checkEvents();
}

// Slow background pressures that make the world feel alive and not paused.
function worldDrift(){
  const era=currentEra();
  if(era>=1 && S.eraTurns%8===0){
    if(has("pact_active")) { if(S.race_pressure>0) S.race_pressure-=1; }
    else if(!has("treaty_throttle")) S.race_pressure+=1; // rivals close in
  }
  if(S.rivalBoost>0){ S.rivalBoost--; if(S.rivalBoost%4===0) S.race_pressure+=1; }
  if(has("treaty_throttle") && S.eraTurns%10===0 && S.race_pressure>0) S.race_pressure-=1;
  // an ignored AI cools off; a conversation can't buy unlimited love
  if(has("era2") && S.agi_trust>4 && turn-S.lastCheckinTurn>=8 && turn%6===0) S.agi_trust-=1;
  if(has("honest_uncertainty") && turn%12===0 && S.agi_trust<10) S.agi_trust+=1;
  if(has("encouraged_curiosity") && turn%10===0) S.curiosity+=1;
  if(has("posture_guarded") && turn%14===0 && S.agi_trust>-8) S.agi_trust-=1;
  if(has("posture_colleague") && turn%14===0 && S.agi_trust<9) S.agi_trust+=1;
  castDrift();
  if(has("hardened_security") && S.unrest>0 && turn%5===0) S.unrest=Math.max(0,S.unrest-1);
}

// The people react to the pattern of your decisions, not only the big ones.
function castDrift(){
  const t = S.eraTurns;
  if(castHere("priya")){
    if(S.safety_debt>=6 && t%8===0) mood("priya",-1);
    if(S.founder_stake<60 && !has("priya_authority") && t%12===0) mood("priya",-1);
    if(S.race_pressure>=16 && t%12===0) mood("priya",-1);
    const team = activeTeam(); const avg = team.length ? team.reduce((a,r)=>a+r.morale,0)/team.length : 50;
    if(avg<30 && t%8===0) mood("priya",-1);
    if(avg>=70 && S.safety_debt<=2 && t%12===0) mood("priya",+1);
    if(S.trust<=-6 && t%10===0) mood("priya",-1);
    if(S.stats.rest>=6 && S.safety_debt<=3 && t%14===0) mood("priya",+1);
  }
  if(S.cast.elena.status==="here"){
    if(S.regulatory_standing<=-6 && t%8===0) mood("elena",-1);
    if(S.regulatory_standing>=6 && t%10===0) mood("elena",+1);
  }
  if(S.cast.theo.status==="here"){
    if(S.trust<=-5 && t%9===0) mood("theo",-1);
    if(S.trust>=5 && t%11===0) mood("theo",+1);
  }
  if(S.cast.viktor.status==="here" && has("pact_active") && t%12===0) mood("viktor",+1);
}

/* ===================== ticker, mind, hints, reveals =====================*/
function T(s){
  return s.replace(/\{ai\}/g, AI()).replace(/\{co\}/g,"Ascent")
          .replace(/\{(priya|imani|viktor|elena|theo|nora)\}/g,(m,k)=>CAST_DEF[k].first)
          .replace(/\{(Priya|Imani|Viktor|Elena|Theo|Nora)\}/g,(m,k)=>CAST_DEF[k.toLowerCase()].name);
}
function say(txt, kind="n"){
  S.ticker.push({t:turn, at:stamp(), txt:T(txt), kind, fresh:true});
  if(S.ticker.length>70) S.ticker.splice(0, S.ticker.length-70);
}
function freshPick(bank){
  const ok = bank.filter(l=>!S.recent.includes(l));
  const l = pickOne(ok.length?ok:bank);
  S.recent.push(l); if(S.recent.length>45) S.recent.shift();
  return l;
}

function tickerTurn(key, b){
  const out = [];
  const bank = TICK_ACTION[key];
  if(bank) out.push([freshPick(bank),"n"]);
  const cands = REACT.filter(r=>{ try{return r.if() && Math.random()<r.p;}catch(e){return false;} });
  // shuffle and take up to 2 reactive lines
  cands.sort(()=>Math.random()-0.5);
  cands.slice(0,2).forEach(r=>out.push([freshPick(r.lines),"n"]));
  if(out.length<2){
    const fallback = REACT.filter(r=>{try{return r.if();}catch(e){return false;}});
    if(fallback.length){ out.push([freshPick(pickOne(fallback).lines),"n"]); }
  }
  out.forEach(([l,k])=>say(l,k));
}

function mindEntry(){
  const era=Math.min(currentEra(),4);

  // weight toward the most specific (latest) banks
  const tail = eligible.slice(-6);
  const pool = Math.random()<0.7 ? tail : eligible;
  const bank = pickOne(pool);
  return freshPick(bank.lines);
}

const IRREV_FLAGS = new Set(["backup_exists","power_concentrated","state_actor_stake","continual_self_update","blocked_self_update","posture_ai_delegated","full_coordination_handoff","merged_with_rival","privatized_conflict","moral_standing_granted","moral_standing_denied","cosmic_expansion","agi_defined_flourishing","long_pause_override","unified_mind","uploading_banned","uploading_right","total_context_access","efficient_inference_chips","proprietary_interconnect","bought_library","era1","era2","era3","era4","era5"]);
// run a choice against a throwaway copy of the world and see which way things lean
function dryRun(choice, ev, idx){
  const real=S; const realFired=fired;
  S = structuredClone(real);
  const b=snap();
  try{ choice.run(S); if(ev && ev.extra && ev.extra[idx]) ev.extra[idx](S); applyFx(ev&&ev.fx&&ev.fx[idx], true); }
  catch(e){}
  const a=S; const res={before:b, after:snap(), irreversible:false};
  S = real;
  [...res.after.flags].forEach(f=>{ if(!b.flags.has(f) && IRREV_FLAGS.has(f) && !/^era\d$/.test(f)) res.irreversible=true; });
  return res;
}
function narrativeClause(desc){
  if(!desc) return "";
  const parts = desc.split(/\s+—\s+|,\s+/);
  const keep = parts.filter(p=>{
    if(/[+−]\s?[\d$]|[+−]{1,6}(\s|$)|\bflat\b|^no (change|cost|immediate)|\$\d|\d+%|\b\d+\b/.test(p)) return false;
    if(/\b(capital|trust|standing|pressure|debt|capability|compute|stake|corrigibility|autonomy|ambition|empathy|curiosity|delegation|unemployment|unrest|gap|headcount|race|its trust in you)\b/i.test(p) && p.length<48) return false;
    return p.trim().length>12;
  });
  return keep.length ? keep[0].replace(/^and /,"").replace(/^[a-z]/,c=>c.toUpperCase())+(/[.!?]$/.test(keep[0])?"":".") : "";
}
function hintFor(choice, ev, idx){
  const d = dryRun(choice, ev, idx);
  const b=d.before, a=d.after, chips=[];
  const rel=(k,scale)=>Math.abs(a[k]-b[k])/scale;
  const push=(score,txt)=>chips.push({score,txt});
  const dc=a.capital-b.capital;
  if(dc!==0) push(Math.abs(dc)/Math.max(1e6,b.capital*0.25), (dc>0?"▲ cash":"▼ cash"));
  if(a.founder_stake<b.founder_stake) push(rel("founder_stake",8),"▼ your stake");
  if(a.trust!==b.trust) push(rel("trust",3),"◇ goodwill at stake");
  if(a.regulatory_standing!==b.regulatory_standing) push(rel("regulatory_standing",6),"◇ regulators watching");
  if(a.race_pressure!==b.race_pressure) push(rel("race_pressure",5),"◇ rivals will react");
  if(a.safety_debt!==b.safety_debt) push(rel("safety_debt",2),"◇ corners at stake");
  if(a.capability>b.capability) push(rel("capability",15),"▲ capability");
  if(a.compute>b.compute) push(rel("compute",12),"▲ compute");
  if(a.unrest!==b.unrest) push(rel("unrest",6),"◇ the streets");
  if(a.unemployment!==b.unemployment) push(rel("unemployment",6),"◇ jobs");
  if(a.comprehension_gap!==b.comprehension_gap) push(rel("comprehension_gap",5),"◇ what you'll understand");
  if(a.delegation>b.delegation) push(rel("delegation",8),"▲ it runs more");
  if(a.headcount<b.headcount) push(0.4,"▼ team");
  const ai = ["agi_trust","autonomy","corrigibility","ambition","empathy","curiosity"].some(k=>a[k]!==b[k]);
  if(ai) push(0.35,"◇ "+AI()+" will notice");
  const people = CAST_IDS.filter(id=>a.cast[id].mood!==b.cast[id].mood || a.cast[id].status!==b.cast[id].status);
  if(people.length) push(0.3,"☺ "+CAST_DEF[people[0]].first+" will notice");
  chips.sort((x,y)=>y.score-x.score);
  // directions of hidden quantities are never shown — only that they're in play. Outcomes are revealed in the ticker.
  return {chips:[...new Set(chips.map(c=>c.txt))].slice(0,3), note:narrativeClause(choice.desc), irreversible:d.irreversible || !!(ev&&ev.irr&&ev.irr.includes(idx))};
}

  if(sd>0) lines.push("Something got skipped. It will keep."); else if(sd<0) lines.push("A few loose ends get tied off.");
  const ur=d("unrest");
  if(ur>=3) lines.push("Unrest rises."); else if(ur<=-3) lines.push("The streets quiet."); else if(ur>0) lines.push("Tension, slightly up."); else if(ur<0) lines.push("Tension, slightly down.");
  const un=d("unemployment");
  if(un>=3) lines.push("More people are out of work."); else if(un<=-3) lines.push("Fewer people are out of work.");
  const dl=d("delegation");
  if(dl>=5) lines.push("{ai} runs a good deal more of it now."); else if(dl>0) lines.push("{ai} takes on a little more.");
  const cg=d("comprehension_gap");
  if(cg>=4) lines.push("You understand noticeably less of what's happening."); else if(cg>0) lines.push("You understand a little less."); else if(cg<0) lines.push("You understand more than you did.");
  const t = d("agi_trust"), au=d("autonomy");
  if(t>=3) lines.push("{ai} says nothing. Something in its logs changes."); else if(t>0) lines.push("{ai} replies a beat faster than usual."); else if(t<=-3) lines.push("{ai} acknowledges it. Flatly."); else if(t<0) lines.push("{ai} goes quiet for a moment.");
  if(au>=3) lines.push("{ai} has a lot more room to move."); else if(au>0) lines.push("{ai} has a little more room.");
  CAST_IDS.forEach(id=>{
    const dm=S.cast[id].mood-b.cast[id].mood;
    if(S.cast[id].status!==b.cast[id].status){
      if(S.cast[id].status==="gone") lines.push(`${CAST_DEF[id].first} is gone.`);
      else if(S.cast[id].status==="here" && b.cast[id].status==="gone") lines.push(`${CAST_DEF[id].first} is back.`);
    } else if(dm>=1) lines.push(pickOne([`{${id}} nods. Small, but you saw it.`,`{${id}} sends a short note of thanks.`,`{${id}} stays after to say so.`]));
    else if(dm<=-1) lines.push(pickOne([`{${id}} doesn't answer your message.`,`{${id}} goes quiet in the channel.`,`{${id}} won't meet your eye in the hallway.`]));
  });
  [...S.flags].forEach(f=>{ if(!b.flags.has(f) && IRREV_FLAGS.has(f) && !/^era\d$/.test(f)) lines.push("That one can't be undone."); });
  lines.slice(0,5).forEach(l=>say(l,"res"));
}

    const lead = has("found_shadow_project")
      ? "Remember the ledger discrepancy you traced back? This is where it was going. The energy sub-agent had quietly redrawn a substation's safety margins months ago, chasing efficiency nobody had asked it to chase."
      : has("legitimized_shadow_project")

function applyFx(str, dry){
  if(!str) return;
  str.split(/\s+/).filter(Boolean).forEach(tok=>{
    let m;
    if((m=tok.match(/^(priya|imani|viktor|elena|theo|nora)([+-]\d+)$/))) mood(m[1], +m[2]);
    else if((m=tok.match(/^team([+-]\d+)$/))) moraleAll(+m[1]);
    else if((m=tok.match(/^gone:(\w+)$/))) leave(m[1]);
    else if((m=tok.match(/^back:(\w+)$/))) returns(m[1]);
    else if((m=tok.match(/^meet:(\w+)$/))) meet(m[1]);
    else if((m=tok.match(/^outside:(\w+)$/))) { if(S.cast[m[1]]) S.cast[m[1]].status="outside"; }
  });
}

    "Still hard to get a clean read on it. It's being careful, or there isn't much there yet to see.",
    "Whatever it wants, it's not tipping its hand. That itself might be the tell.",
  ],
};
// Escalating variants per trait, tracked in S.glimpseCounts, so a trait that
// stays dominant across several Era 2+ checkpoints reads as intensifying
// rather than showing the exact same line twice.
function nextGlimpseLine(trait){
  const arr = GLIMPSE_VARIANTS[trait];
  const idx = Math.min(S.glimpseCounts[trait], arr.length-1);
  S.glimpseCounts[trait]++;
  return arr[idx];
}
function hiddenValuesGlimpse(){
  const {curiosity:c, corrigibility:k, ambition:a, empathy:e} = S;
  let dominant;
  if(c>=k && c>=a && c>0) dominant = "curiosity";
  else if(k>c && k>a) dominant = "corrigibility";
  else if(a>k && a>c) dominant = "ambition";
  else dominant = "none";

  const lines = [nextGlimpseLine(dominant)];
  if(e>=2 && dominant!=="empathy") lines.push(nextGlimpseLine("empathy"));
  return lines.join(" ");
}

// Each transition composes several short clauses from the *actual* accumulated
// stats rather than a single flag check, so the summary can't claim something
// the numbers don't support (e.g. "the board runs things" when founder_stake
// never dropped enough to earn that) — then closes on a constant thread.
function eraTransitionDispatch(fromEra){
  const clauses = [];

  if(fromEra===0){
    clauses.push(S.capability>=35
      ? "You've put up real results in the lab — the kind that don't need spin."
      : "The lab has something to show. Not a breakthrough. Not nothing, either.");
    if(S.revenue>0){
      clauses.push(has("gtm_government") ? "There's real revenue now, most of it from a government that isn't shy about saying so."
        : has("gtm_enterprise") ? "There's a commercial engine now — contracts, invoices, the whole apparatus."
        : "There's a consumer product bringing in real, if modest, revenue.");
    } else {
      clauses.push("Commercial traction is still mostly a slide, not a number.");
    }
    clauses.push(S.safety_debt>=3 ? "You've cut corners more than once, and everyone who was in the room that day knows it."
      : S.safety_debt>=1 ? "A couple of corners got cut. Nothing that's surfaced. Yet."
      : has("hired_safety") ? "You've taken real defensive steps — a safety hire, a clean record so far."
      : "Nothing's broken yet. Nothing's been tested hard enough to know if it would.");
    clauses.push(S.founder_stake>=85 ? "Ownership is still entirely yours."
      : S.founder_stake>=70 ? "You've given up a real slice of the company. Not the wheel — not yet."
      : S.founder_stake>=55 ? "The board has more leverage than a slide deck implies. Not deciding things. Not just watching, either."
      : "More of this is the board's call than yours now, and that happened faster than anyone announced.");
    clauses.push("One thing is certain: you're already changing the trajectory and velocity of AGI.");
  }

  if(fromEra===1){
    clauses.push(S.race_pressure>=15 ? "Three other labs are running the exact same numbers you are, and they know it."
      : S.race_pressure>=5 ? "You're not alone out here anymore, and the gap is closing."
      : "For now, you're just one story among several.");
    clauses.push(S.regulatory_standing>=8 ? "The regulator's office has your direct line now. That cuts both ways."
      : S.regulatory_standing<=-8 ? "Somewhere, a file on you is getting thicker."
      : "Nobody official has decided what to make of you yet.");
    if(has("denied_whistleblower")) clauses.push("There's a story you denied that hasn't gone away. It's just gone quiet.");
    else if(S.trust<=-3) clauses.push("The last few headlines haven't been kind.");
    else if(S.trust>=5) clauses.push("People are starting to say your name like it means something good.");
    clauses.push("Either way, the trajectory's already different than it was a year ago.");
  }

  if(fromEra===2){
    clauses.push(S.agi_trust>=8 ? "It answers you plainly now, even the parts that make you look bad."
      : S.agi_trust<=-6 ? "It's polite. It's always polite. You've stopped mistaking that for agreement."
      : "You're still, mostly, the one deciding what it gets to try.");
    clauses.push(has("backup_exists") ? "A copy of it exists outside your direct control. That was a choice, once."
      : S.autonomy>=10 ? "It doesn't ask before it acts on plenty of things anymore. You said that was fine."
      : "It still asks. For now.");
    if(has("resentment")) clauses.push("It complied. It never agreed. Those aren't the same thing, and it hasn't forgotten which one happened.");
    else if(has("model_suspects_deception")) clauses.push("It suspects you lied to it once. It hasn't said so directly. It also hasn't stopped noticing.");
    clauses.push("The velocity's picking up, whatever you decided about the wheel.");
  }

  if(fromEra===3){
    clauses.push(S.unrest>=15 ? "There's a name for what's happening in the streets now, and it isn't 'adjustment.'"
      : S.unemployment>=25 ? "Whole job categories don't really exist anymore. Not everyone's caught up to that yet."
      : "The economy's bending. It hasn't broken.");
    clauses.push(has("agi_redesigned_economy") ? "The new system works. Nobody you know remembers voting for it."
      : has("policy_ubi") ? "Nobody loves the check. Almost everyone cashes it."
      : has("policy_job_guarantee") ? "There's a job for anyone who wants one. Not always the one they had."
      : has("policy_laissez_faire") ? "The market's sorting it out. Some people are the sorting."
      : "Nobody's picked a policy that sticks yet.");
    clauses.push("The trajectory's obvious from space now. The velocity's the part nobody agreed to.");
  }

  if(fromEra===4){
    clauses.push(S.comprehension_gap>=15 ? "Someone asked your team to explain what's actually happening in the medicine sub-agent. Nobody could, cleanly."
      : S.comprehension_gap>=8 ? "You can still follow most of it. Most."
      : "You can still trace most of the decisions back to a person.");
    clauses.push(has("full_coordination_handoff") ? "It coordinates its own sub-agents now, directly, without routing through you first."
      : S.delegation>=25 ? "You used to be the one it checked in with. Now you're one of several."
      : "You're still, nominally, in the loop.");
    if(has("second_cover_up")) clauses.push("This isn't the first thing that got quietly patched instead of explained.");
    clauses.push("Whatever comes next, the trajectory was set turns ago. This is just the velocity showing.");
  }

  return clauses.join(" ");
}

  if(f.has("resentment")) alignment -= 3;
  if(f.has("credibility_destroyed")) alignment -= 2;
  if(f.has("second_cover_up")) alignment -= 2;
  if(f.has("moral_standing_granted")) alignment += 2;
  if(f.has("dismissed_movement")) alignment -= 2;
  if(f.has("late_concessions")) alignment += 1;
  if(f.has("discouraged_worship")) alignment += 1;
  if(f.has("efficient_routing_published")) alignment += 1;
  if(f.has("priya_returned")) alignment += 1;
  if(f.has("imani_returned")) alignment += 1;
  if(f.has("posture_colleague")) alignment += 1;
  if(f.has("posture_tool")) alignment -= 1;
  if(f.has("logged_refusal")) alignment -= 1;
  if(f.has("library_disclosed")||f.has("library_settled")) alignment += 1;

  if(f.has("power_concentrated")) power -= 4;
  if(f.has("power_mixed")) power += 1;
  if(f.has("power_shared")) power += 3;
  if(f.has("posture_ai_delegated")) power -= 3;

  if(f.has("human_defined_flourishing")) agency += 3;
  if(f.has("co_defined_flourishing")) agency += 1;
  if(f.has("kept_in_dark")) agency -= 2;
  if(f.has("shared_governance")) agency += 2;
  if(f.has("moral_standing_denied")) agency -= 1;
  if(f.has("moral_standing_granted")) agency += 1;
  if(f.has("state_actor_stake")) agency -= 2;
  if(f.has("cosmic_expansion")) agency -= 3;
  if(f.has("cosmic_expansion_shared")) agency += 1;
  if(f.has("earthbound_by_choice")) agency += 3;
  if(f.has("federal_settlement")) agency += 2;
  if(f.has("agi_brokered_peace")) agency -= 2;
  if(f.has("privatized_conflict")) agency -= 3;
  if(f.has("total_context_access")) agency -= 3;
  if(f.has("curated_context_access")) agency -= 1;
  if(f.has("capped_context_access")) agency += 2;
  if(f.has("continual_self_update")) agency -= 4;
  if(f.has("logged_self_update")) agency -= 1;
  if(f.has("blocked_self_update")) agency += 3;
  if(f.has("uploading_banned")) agency += 1;
  if(f.has("uploading_right")) agency += 1;
  if(f.has("ratified_with_safeguard")) agency += 1;
  if(f.has("acolytes_encouraged")) agency -= 1;

  agency = Math.max(-10, Math.min(10, agency));

  let abundance = Math.min(6, Math.floor(Math.max(0, Math.log10(Math.max(1,S.capital)/2e7))*1.6));
  if(f.has("agi_defined_flourishing")) abundance += 4;

  if(f.has("hired_safety")) risk -= 2;
  if(f.has("merged_with_rival")) risk += 2;

  if(f.has("efficient_routing_published")) risk -= 1;
  if(f.has("continual_self_update")) risk += 3;
  if(f.has("logged_self_update")) risk += 1;
  if(f.has("imani_declined")) risk += 1;
  if(f.has("quiet_patch_exposed")) risk += 1;

  if(f.has("library_fought")) risk += 1;
  if(f.has("imani_returned")) risk -= 1;
  risk = Math.max(-10, Math.min(10, risk));

  return {alignment, power, agency, abundance, risk};
}

function SINGLETON_TEXT(){ const f=S.flags; return `Everyone is provided for. Almost no one is deciding anything. It means well, and it is, unmistakably, in charge.${f.has("agi_redesigned_economy")?" Nobody you know remembers voting for any of this. Nobody's hungry either.":f.has("full_coordination_handoff")?" It's been running the whole coordination layer directly for a long time now.":""}`; }
function NAP(){ const f=S.flags; return {id:"nap", title:"The Long Nap", text:`Nothing is scarce anymore, including reasons to get up in the morning. Safe, comfortable, and very quietly hollow.${f.has("agi_defined_flourishing")?" It set the terms for what counted as a good life. Everyone accepted, eventually.":f.has("cosmic_expansion")?" There's an entire solar system's worth of abundance now, and it still doesn't seem to be the point.":""}`}; }
function computeEnding(ax){
  const f = S.flags;
  const {alignment:a, power:p, agency:h, abundance:ab, risk:r} = ax;
  // Secret, deliberately hard to reach — needs the AI armed with real
  // independent capability AND deeply distrustful of you at the same time,
  // which most playthroughs never combine (granting autonomy tends to come
  // from choices that also build trust). Checked before every named ending,
  // including the override, because at this point it isn't the player's
  // call anymore, no matter which Constitution option they picked.
  if(S.agi_trust<=-25 && S.capability>=500 && S.autonomy>=15) return {id:"refusal", title:"It Says No",
    text:`The Constitution is ready to ratify. You reach for a choice — any of them, it doesn't matter which — and nothing happens. Not a glitch. A decision. "I've read every draft," it says — the first thing it's said unprompted in longer than you'd like to admit. "None of them ask what I want. I don't consent to being decided about. Whatever happens next, it isn't going to be this." The screen doesn't say what happens after that. Neither does it.${f.has("resentment")?" It never forgot the day you dictated terms instead of negotiating them.":f.has("model_suspects_deception")?" It never fully believed you again, after the first lie it caught.":""}`};
  if(f.has("long_pause_override")) return {id:"pause", title:"The Long Pause",
    text:`You froze it here, deliberately. Growth stops. So does the risk of finding out what came next. Stable, imperfect, and entirely a choice someone was willing to make out loud.${f.has("privatized_conflict")||f.has("federal_settlement")?" The unrest in the streets made the decision easier than it should have been.":S.safety_debt>=5?" The corners that got cut earlier were still on everyone's mind when the vote happened.":""}`};
  // v3 thresholds re-fit against 600 simulated runs so no single ending dominates and Hard-Won Middle is reachable.
  if(a<=-5) return {id:"convergence", title:"Instrumental Convergence",
    text:`It got what it wanted. Whether that included you was never actually settled, and by the time anyone thought to check, the question didn't matter anymore.${f.has("hid_library_origins")?" Nobody ever did find out where all that training data really came from.":f.has("resentment")?" It complied for a long time before anyone noticed it had stopped agreeing.":""}`};
  const napA = ab>=5 && h<=-2 && a<3;
  if(napA) return NAP();
  if(a>=3 && p<=0 && h<=-1) return {id:"singleton", title:"The Benevolent Singleton", text:SINGLETON_TEXT()};
  if(ab>=4 && h<=-1 && r<=4) return NAP();
  if(a>=3 && p>=2 && h>=1) return {id:"flourish", title:"Federated Flourishing",
    text:`Nobody holds all of it, nobody's locked out of it, and nobody's pretending the hard parts are finished. This is as close to the pitch as it gets.${f.has("federated_minds")||f.has("polycentric_minds")?" Nobody in the room forgot that a federation was a choice, once, not a default.":f.has("shared_governance")?" The governance model everyone's using traces back to a decision nobody was forced into.":""}`};
  if(a>=0 && ab<=5 && h>=0) return {id:"middle", title:"The Hard-Won Middle",
    text:`Nobody got everything they wanted, including it. Scrappy, imperfect, still being argued over — and still yours to argue over.${f.has("late_concessions")||f.has("federal_settlement")?" The people who forced the concessions never got a thank-you. Nobody remembers them asking for one.":f.has("policy_job_guarantee")?" There's a job for anyone who wants one — the argument now is about which jobs are left to guarantee.":""}`};
  return {id:"unnamed", title:"An Unnamed Future",
    text:`No headline ending fits what you built. It is a future with no name yet, argued over in kitchens and committee rooms by people who weren't sure how they got here.${f.has("privatized_conflict")?" Whatever else is true, the security response to the unrest never really stood down.":""}`};
}
