<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanizer Review — tmllx.com</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2dfd9;
    --text: #1c1b19;
    --muted: #706d66;
    --light: #a8a49c;
    --accent: #1a56db;
    --accept-border: #22c55e;
    --accept-text: #15803d;
    --accept-bg: #f0fdf4;
    --before-bg: #fff8f8;
    --after-bg: #f8fff9;
    --tag-bg: #eef2ff;
    --tag-text: #3730a3;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.04);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 110px;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 28px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .topbar-left { display: flex; flex-direction: column; gap: 2px; min-width: 160px; }
  .topbar-title { font-size: 14px; font-weight: 700; }
  .topbar-sub   { font-size: 11px; color: var(--muted); }
  .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 160px; }
  .prog-outer { flex: 1; height: 5px; background: #e8e5df; border-radius: 99px; overflow: hidden; }
  .prog-inner { height: 100%; background: var(--accept-border); border-radius: 99px; width: 0%; transition: width 0.3s; }
  .prog-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .file-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .fpill {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
    background: #f0f0ee; color: var(--muted); white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
  }
  .fpill-count {
    background: var(--accept-border); color: white; border-radius: 99px;
    padding: 0 5px; font-size: 10px; line-height: 16px; min-width: 16px; text-align: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .fpill-count.on { opacity: 1; }

  /* ── Main ── */
  .main { max-width: 1080px; margin: 0 auto; padding: 24px 28px; }

  .sec-head {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--muted);
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
    margin: 28px 0 10px;
  }
  .sec-head:first-child { margin-top: 0; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid #e2dfd9;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-left-color 0.18s, opacity 0.18s;
  }
  .card.accepted { border-left-color: var(--accept-border); }
  .card.skipped  { opacity: 0.42; }
  .card.skipped .after-col { background: #f8f8f6; }
  .card.applied  { opacity: 0.5; pointer-events: none; }

  .card-head {
    padding: 11px 14px 9px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fdfcfb;
    border-bottom: 1px solid var(--border);
  }
  .card-label { font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .tag {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px;
    background: var(--tag-bg); color: var(--tag-text);
    text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
  }
  .note {
    padding: 7px 14px;
    font-size: 12px; color: var(--muted); line-height: 1.5;
    background: #fffef5; border-bottom: 1px solid #f0ead0;
  }

  .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .col  { padding: 12px 14px; }
  .col + .col { border-left: 1px solid var(--border); }
  .col-head { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 7px; }
  .before-col { background: var(--before-bg); }
  .before-col .col-head { color: #b91c1c; }
  .after-col  { background: var(--after-bg); }
  .after-col  .col-head { color: var(--accept-text); }

  .before-text {
    font-size: 13px; line-height: 1.65; color: #555;
    white-space: pre-wrap; word-break: break-word;
  }
  .after-ta {
    width: 100%; font-size: 13px; line-height: 1.65; color: var(--text);
    background: transparent; border: 1.5px solid transparent;
    border-radius: 6px; padding: 4px 6px;
    resize: vertical; min-height: 52px; font-family: inherit;
    transition: border-color 0.15s; display: block;
  }
  .after-ta:focus { outline: none; border-color: var(--accent); background: white; }
  .card.skipped .after-ta { pointer-events: none; }

  .actions {
    padding: 9px 14px; border-top: 1px solid var(--border);
    display: flex; gap: 6px; align-items: center;
    background: #fdfcfb;
  }
  .btn {
    font-size: 12px; font-weight: 700; padding: 6px 14px;
    border-radius: 6px; border: 1.5px solid transparent;
    cursor: pointer; transition: all 0.12s; letter-spacing: 0.1px;
    line-height: 1;
  }
  .btn-accept { background: var(--accept-bg); color: var(--accept-text); border-color: #bbf7d0; }
  .btn-accept:hover, .btn-accept.on { background: var(--accept-border); color: white; border-color: var(--accept-border); }
  .btn-skip { background: #f3f4f6; color: var(--muted); border-color: #e5e7eb; }
  .btn-skip:hover, .btn-skip.on { background: #9ca3af; color: white; border-color: #9ca3af; }
  .btn-undo { background: none; border: none; color: var(--light); font-size: 11px; padding: 4px 8px; cursor: pointer; }
  .btn-undo:hover { color: var(--muted); }
  .act-hint { margin-left: auto; font-size: 11px; color: var(--light); }

  /* ── Apply bar ── */
  .apply-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 28px; display: flex; align-items: center; gap: 16px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 100;
  }
  .apply-info { flex: 1; }
  .apply-count { font-size: 15px; font-weight: 700; }
  .apply-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .btn-apply {
    font-size: 14px; font-weight: 700; padding: 11px 28px;
    border-radius: 8px; border: none; background: var(--accent); color: white;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .btn-apply:hover:not(:disabled) {
    background: #1648c7; transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(26,86,219,0.35);
  }
  .btn-apply:disabled { background: #c0c9e0; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-apply.done { background: var(--accept-border); }

  /* ── Toast ── */
  .toast {
    position: fixed; top: 68px; left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: #1e293b; color: white; padding: 11px 20px;
    border-radius: 9px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0;
    transition: all 0.22s; pointer-events: none; z-index: 300; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err  { background: #991b1b; }

  /* ── Compat warning ── */
  .compat-warn {
    background: #fefce8; border: 1px solid #fde047; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #713f12;
    display: none;
  }

  @media (max-width: 680px) {
    .cols { grid-template-columns: 1fr; }
    .col + .col { border-left: none; border-top: 1px solid var(--border); }
    .file-pills { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">Humanizer Review</div>
    <div class="topbar-sub">tmllx.com &mdash; 20 changes</div>
  </div>
  <div class="progress-wrap">
    <div class="prog-outer"><div class="prog-inner" id="progBar"></div></div>
    <div class="prog-label" id="progLabel">0 / 20 accepted</div>
  </div>
  <div class="file-pills" id="filePills"></div>
</div>

<div class="main">
  <div class="compat-warn" id="compatWarn">
    ⚠️ Your browser may not support direct file writing. For best results, open this file in <strong>Chrome</strong> or <strong>Edge</strong>.
  </div>
  <div id="cards"></div>
</div>

<div class="apply-bar">
  <div class="apply-info">
    <div class="apply-count" id="applyCount">No changes accepted yet</div>
    <div class="apply-sub" id="applySub">Accept changes above, then click to write them to your files</div>
  </div>
  <button class="btn-apply" id="applyBtn" disabled onclick="applyAll()">Apply to files</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CHANGES = [
  // index.html
  { id:'idx-tagline', file:'index.html', section:'index.html', label:'Homepage tagline',
    tags:['AI vocabulary','passive framing'],
    note:'"Operationalize" is heavy AI jargon. First-person is more direct. The added "not just pilots" gives it a real opinion.',
    before:'AI strategy leader helping enterprises operationalize predictive, generative, and agentic AI.',
    after:'I help enterprises get real operating value out of AI \u2014 not just pilots.' },

  { id:'idx-impact1', file:'index.html', section:'index.html', label:'Impact \u2014 item 1',
    tags:['vague qualifier'],
    note:'"Validated" is a filler qualifier \u2014 the number already makes the claim.',
    before:'Delivered $100M+ validated annual value across enterprise AI programs',
    after:'Delivered $100M+ in annual value across enterprise AI programs' },

  { id:'idx-impact2', file:'index.html', section:'index.html', label:'Impact \u2014 item 2',
    tags:['unnecessary adjective'],
    note:'"Strategic" before "partnerships" adds no information.',
    before:'Led strategic partnerships with BCG, NVIDIA, and SAP',
    after:'Led partnerships with BCG, NVIDIA, and SAP' },

  { id:'idx-impact3', file:'index.html', section:'index.html', label:'Impact \u2014 item 3',
    tags:['AI vocabulary'],
    note:'"Scaled" implies you grew it from nothing. "Ran" is more accurate.',
    before:'Scaled global retention and renewal operations across 200+ accounts',
    after:'Ran global retention and renewal operations across 200+ accounts' },

  // about.html
  { id:'about-bio1', file:'about.html', section:'about.html', label:'Bio \u2014 paragraph 1',
    tags:['AI vocabulary','rule of three','vague qualifier'],
    note:'"Operating leverage" is MBA jargon. "Validated annual impact" buries the number with a qualifier. New ending has a sharper point of view.',
    before:'I help enterprises turn AI capability into operating leverage. My work spans strategy, customer transformation, and commercial execution across predictive, generative, and agentic AI. I\u2019ve led global portfolios, built partnerships with BCG and NVIDIA, and supported programs delivering $100M+ in validated annual impact. Recently I\u2019ve focused on scaling adoption and designing renewal and pricing models that make AI platforms durable inside large organizations.',
    after:'I help enterprises turn AI capability into something that shows up in their financials. The work has mostly been strategy and commercial execution \u2014 figuring out which AI bets are worth making and getting them to stick. I\u2019ve worked across predictive, generative, and agentic AI, built partnerships with BCG and NVIDIA, and been part of programs delivering $100M+ in annual business impact. Lately I\u2019ve been focused on the harder end of that problem: designing renewal and pricing models that make AI platforms survive past the first year.' },

  { id:'about-bio2', file:'about.html', section:'about.html', label:'Bio \u2014 paragraph 2',
    tags:['rule of three','-ing padding'],
    note:'"Building, making" are redundant. The Vermont detail already does the emotional work of "landscape that shaped me."',
    before:'I live on the North Shore of Massachusetts with my wife and daughter. Outside of work I enjoy cooking, furniture making, gravel riding, and working on small projects that combine design, materials, and function. I\u2019m currently designing a home in rural Vermont, where I grew up, as a long-term base for building, making, and spending more time close to the landscape that shaped me.',
    after:'I live on the North Shore of Massachusetts with my wife and daughter. Outside work I cook, make furniture, and ride gravel. I\u2019m also slowly designing a house in rural Vermont, where I grew up \u2014 part workshop, part home base for being outdoors.' },

  { id:'about-exp-dr-amer', file:'about.html', section:'about.html', label:'Experience \u2014 DataRobot AMER',
    tags:['-ing phrase padding','vague qualifier'],
    note:'"Validated" is filler. "Generating $2M+ incremental pipeline" is a dangling -ing tack-on.',
    before:'Led enterprise AI transformation strategy across a $20M+ portfolio spanning financial services, healthcare, CPG, and TMT. Delivered $100M+ in validated annual business impact and built GenAI expansion strategy generating $2M+ incremental pipeline.',
    after:'Led enterprise AI transformation strategy across a $20M+ portfolio spanning financial services, healthcare, CPG, and TMT. Delivered $100M+ in annual business impact and built a GenAI expansion strategy that opened $2M+ in new pipeline.' },

  { id:'about-exp-dr-ai', file:'about.html', section:'about.html', label:'Experience \u2014 DataRobot AI Success',
    tags:['AI vocabulary'],
    note:'"Joint solution motion" is consultant-speak. "Partnership" says the same thing plainly.',
    before:'Built and scaled BCG\u2013DataRobot joint solution motion and designed a 400-person enablement program improving modeling efficiency by 40%.',
    after:'Built the BCG\u2013DataRobot partnership and designed a 400-person enablement program improving modeling efficiency by 40%.' },

  { id:'about-exp-bcg', file:'about.html', section:'about.html', label:'Experience \u2014 BCG',
    tags:['-ing phrase padding','rule of three'],
    note:'"Combining X, Y, and Z across global stakeholder groups" is a textbook AI rule-of-three piled onto a vague -ing phrase.',
    before:'Supported enterprise transformation initiatives combining analytics, workflow redesign, and change management across global stakeholder groups.',
    after:'Supported enterprise transformation projects at large global companies, working across analytics, process redesign, and change management.' },

  { id:'about-skill1', file:'about.html', section:'about.html', label:'Skill header \u2014 AI Value Creation',
    tags:['title case'],
    note:'Title case in section headers is an AI tell. Sentence case is less formulaic.',
    before:'<h4>AI Value Creation</h4>',
    after:'<h4>AI value creation</h4>' },

  { id:'about-skill2', file:'about.html', section:'about.html', label:'Skill header \u2014 Commercial Leadership',
    tags:['title case'],
    note:'Title case in section headers is an AI tell.',
    before:'<h4>Commercial Leadership</h4>',
    after:'<h4>Commercial leadership</h4>' },

  { id:'about-skill3', file:'about.html', section:'about.html', label:'Skill header \u2014 Analytics & Technology',
    tags:['title case'],
    note:'Title case in section headers is an AI tell.',
    before:'<h4>Analytics &amp; Technology</h4>',
    after:'<h4>Analytics &amp; technology</h4>' },

  // projects.html
  { id:'proj-meeting', file:'projects.html', section:'projects.html', label:'App \u2014 Meeting Agent',
    tags:['rule of four','-ing phrase padding'],
    note:'"Agentic workflow automating X, Y, Z, W to scale capacity" is a textbook AI sentence \u2014 rule-of-four list, -ing opener, vague benefit.',
    before:'Agentic workflow automating call preparation, follow-up email generation, risk analysis, and coaching to scale account management capacity.',
    after:'An agent that handles call prep, follow-up drafting, and deal risk flagging \u2014 so account managers can spend more time on actual accounts.' },

  { id:'proj-portfolio', file:'projects.html', section:'projects.html', label:'App \u2014 Portfolio Risk Analyzer',
    tags:['rule of three','abstract language'],
    note:'"Early-warning signals" and "intervention priorities" are abstract. The rewrite says what it does in plain language.',
    before:'Surfaces early-warning signals across an account portfolio to identify renewal risk, expansion readiness, and intervention priorities.',
    after:'Shows you which accounts are heading toward a bad renewal before it\u2019s too late to do anything about it.' },

  { id:'proj-roi', file:'projects.html', section:'projects.html', label:'App \u2014 ROI Calculator',
    tags:['AI vocabulary','-ing phrase padding'],
    note:'"Generating validated ROI narratives" is dense AI-speak. "ROI narrative" isn\u2019t how humans think about a business case.',
    before:'Connects workflow-level AI adoption metrics to business outcomes, generating validated ROI narratives for executive and renewal conversations.',
    after:'Connects AI adoption data to dollar outcomes. Useful for renewals where the value story needs to hold up in front of an executive.' },

  { id:'proj-renewal', file:'projects.html', section:'projects.html', label:'App \u2014 Renewal Risk System',
    tags:['AI vocabulary','subjectless framing'],
    note:'"Structured forecasting and qualification framework that standardizes escalation pathways" is dense jargon.',
    before:'Structured forecasting and qualification framework that standardizes renewal readiness scoring and escalation pathways across distributed teams.',
    after:'A scoring system that gives distributed renewal teams a shared language for risk \u2014 so escalations happen earlier and nothing slips through.' },

  { id:'cs-retention', file:'projects.html', section:'projects.html', label:'Case study \u2014 Retention Operations',
    tags:['AI vocabulary','weak ending'],
    note:'"Operationalize the new motion at scale" is jargon. The weak ending buries the 30% number already shown in the badge.',
    before:'Led global retention strategy and operating model transformation during a critical platform transition. Redesigned renewal processes end-to-end, then designed and deployed a suite of internal agents, tools, and dashboards to operationalize the new motion at scale. The result was measurably stronger in-period performance across a distributed global team.',
    after:'DataRobot was mid-transition to a new platform model and the renewal process hadn\u2019t kept pace. I rebuilt it \u2014 new playbooks, new escalation paths, new qualification criteria \u2014 then built the internal agents and dashboards to run it across a global team. In-period gross retention improved 30%.' },

  { id:'cs-100m', file:'projects.html', section:'projects.html', label:'Case study \u2014 $100M Business Impact',
    tags:['AI vocabulary','-ing phrase padding','false range'],
    note:'"Orchestrated" is a classic AI word. "From use-case prioritization through production deployment" is a false range \u2014 it just means start to finish.',
    before:'Led AI transformation strategy across a $20M+ account portfolio spanning financial services, healthcare, CPG, and TMT. Orchestrated end-to-end adoption programs linking predictive, generative, and agentic AI capabilities to measurable profitability outcomes, from use-case prioritization through production deployment.',
    after:'Led AI transformation strategy across a $20M+ portfolio spanning financial services, healthcare, CPG, and TMT. I worked with customer teams to figure out which AI use cases were worth building \u2014 predictive, generative, and agentic \u2014 and saw them through to production.' },

  { id:'cs-250', file:'projects.html', section:'projects.html', label:'Case study \u2014 250% Revenue Growth',
    tags:['-ing phrase padding','promotional language'],
    note:'"Securing marquee enterprise logos" is promotional. "Unlocking a new growth segment" is a classic AI -ing tack-on.',
    before:'Co-engineered a vertical go-to-market strategy targeting Supply Chain buyers for a predictive analytics platform. Defined solution positioning, customer segmentation, and delivery motion from the ground up, securing marquee enterprise logos and unlocking a new growth segment for the company.',
    after:'Co-engineered a vertical go-to-market strategy targeting Supply Chain buyers for a predictive analytics platform. Defined positioning, segmentation, and delivery model from scratch, landed several large enterprise customers, and turned Supply Chain into one of the company\u2019s fastest-growing segments.' },

  { id:'cs-bcg', file:'projects.html', section:'projects.html', label:'Case study \u2014 BCG Partnership',
    tags:['-ing phrase padding','AI vocabulary'],
    note:'"Generating immediate revenue and establishing a repeatable channel motion" buries the actual numbers already in the outcome badge.',
    before:'Built and scaled a joint go-to-market solution with BCG, combining DataRobot\u2019s AutoML platform with BCG\u2019s transformation methodology. Developed the engagement model, co-delivery playbook, and client pipeline from scratch, generating immediate revenue and establishing a repeatable channel motion.',
    after:'Built the DataRobot\u2013BCG partnership \u2014 engagement model, delivery playbook, and early client pipeline \u2014 from scratch. The first engagements brought in $500K and opened a $2M pipeline.' }
];

// ── State ─────────────────────────────────────────────────────────────────────
const state = {};
CHANGES.forEach(c => { state[c.id] = { status: 'pending', text: c.after }; });

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (err ? ' err' : '') + ' show';
  setTimeout(() => { el.className = 'toast' + (err ? ' err' : ''); }, 4500);
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  // Check compat
  if (!window.showDirectoryPicker) {
    document.getElementById('compatWarn').style.display = 'block';
  }

  const sections = {};
  CHANGES.forEach(c => { (sections[c.section] = sections[c.section] || []).push(c); });

  let html = '';
  for (const [sec, list] of Object.entries(sections)) {
    html += `<div class="sec-head">${esc(sec)}</div>`;
    list.forEach(c => { html += cardHTML(c); });
  }
  document.getElementById('cards').innerHTML = html;
  document.querySelectorAll('.after-ta').forEach(fit);
  updateSummary();
}

function cardHTML(c) {
  const s = state[c.id];
  const cls = s.status === 'accepted' ? ' accepted' : s.status === 'skipped' ? ' skipped' : '';
  const aOn = s.status === 'accepted' ? ' on' : '';
  const sOn = s.status === 'skipped'  ? ' on' : '';
  const undoBtn = s.status !== 'pending'
    ? `<button class="btn-undo" onclick="setStatus('${c.id}','pending')">undo</button>` : '';
  return `
  <div class="card${cls}" id="card-${c.id}">
    <div class="card-head">
      <span class="card-label">${esc(c.label)}</span>
      <div class="tags">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="note">${esc(c.note)}</div>
    <div class="cols">
      <div class="col before-col">
        <div class="col-head">Before</div>
        <div class="before-text">${esc(c.before)}</div>
      </div>
      <div class="col after-col">
        <div class="col-head">After &mdash; edit freely</div>
        <textarea class="after-ta" id="ta-${c.id}"
          oninput="onTA('${c.id}',this)"
          onfocus="if(state['${c.id}'].status!=='skipped') setStatus('${c.id}','accepted')"
        >${esc(s.text)}</textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-accept${aOn}" onclick="setStatus('${c.id}','accepted')">${s.status==='accepted'?'✓ Accepted':'Accept'}</button>
      <button class="btn btn-skip${sOn}"   onclick="setStatus('${c.id}','skipped')">${s.status==='skipped'?'Skipped':'Skip'}</button>
      ${undoBtn}
      <span class="act-hint">Click into After text to auto-accept</span>
    </div>
  </div>`;
}

// ── Card interactions ─────────────────────────────────────────────────────────
function setStatus(id, newStatus) {
  if (state[id].status === newStatus) newStatus = 'pending';
  state[id].status = newStatus;
  refreshCard(id);
  updateSummary();
}

function onTA(id, el) {
  state[id].text = el.value;
  fit(el);
}

function fit(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function refreshCard(id) {
  const c = CHANGES.find(x => x.id === id);
  const s = state[id];
  const card = document.getElementById('card-' + id);
  if (!card) return;

  card.className = 'card' + (s.status==='accepted'?' accepted':s.status==='skipped'?' skipped':'');

  const ab = card.querySelector('.btn-accept');
  ab.className = 'btn btn-accept' + (s.status==='accepted'?' on':'');
  ab.textContent = s.status==='accepted' ? '✓ Accepted' : 'Accept';

  const sb = card.querySelector('.btn-skip');
  sb.className = 'btn btn-skip' + (s.status==='skipped'?' on':'');
  sb.textContent = s.status==='skipped' ? 'Skipped' : 'Skip';

  const acts = card.querySelector('.actions');
  let ub = acts.querySelector('.btn-undo');
  if (s.status !== 'pending') {
    if (!ub) {
      ub = document.createElement('button');
      ub.className = 'btn-undo';
      ub.textContent = 'undo';
      ub.onclick = () => setStatus(id, 'pending');
      sb.after(ub);
    }
  } else if (ub) { ub.remove(); }
}

// ── Summary bar ───────────────────────────────────────────────────────────────
function updateSummary() {
  const accepted = CHANGES.filter(c => state[c.id].status === 'accepted');
  const n = accepted.length;
  const total = CHANGES.length;

  document.getElementById('progBar').style.width = (n / total * 100) + '%';
  document.getElementById('progLabel').textContent = n + ' / ' + total + ' accepted';

  // file pills
  const byFile = {};
  accepted.forEach(c => { byFile[c.file] = (byFile[c.file] || 0) + 1; });
  const allFiles = [...new Set(CHANGES.map(c => c.file))];
  document.getElementById('filePills').innerHTML = allFiles.map(f => {
    const cnt = byFile[f] || 0;
    return `<div class="fpill">${f}<span class="fpill-count${cnt?' on':''}">${cnt}</span></div>`;
  }).join('');

  const applyBtn = document.getElementById('applyBtn');
  const applyCount = document.getElementById('applyCount');
  const applySub = document.getElementById('applySub');

  if (n === 0) {
    applyCount.textContent = 'No changes accepted yet';
    applySub.textContent = 'Accept changes above, then click to write them to your files';
    applyBtn.disabled = true;
  } else {
    const files = [...new Set(accepted.map(c => c.file))];
    applyCount.textContent = n + ' change' + (n===1?'':'s') + ' ready to apply';
    applySub.textContent = 'Will update: ' + files.join(', ');
    applyBtn.disabled = false;
  }
}

// ── Apply via File System Access API ─────────────────────────────────────────
async function applyAll() {
  const accepted = CHANGES.filter(c => state[c.id].status === 'accepted');
  if (!accepted.length) return;

  if (!window.showDirectoryPicker) {
    toast('Your browser doesn\'t support direct file writing. Try Chrome or Edge.', true);
    return;
  }

  const applyBtn = document.getElementById('applyBtn');
  applyBtn.disabled = true;
  applyBtn.textContent = 'Pick folder…';

  let dirHandle;
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (e) {
    // User cancelled
    applyBtn.disabled = false;
    applyBtn.textContent = 'Apply to files';
    updateSummary();
    return;
  }

  applyBtn.textContent = 'Applying…';

  // Group by file
  const byFile = {};
  accepted.forEach(c => { (byFile[c.file] = byFile[c.file] || []).push(c); });

  const results = [];
  let appliedCount = 0;
  let notFoundCount = 0;

  for (const [filename, changes] of Object.entries(byFile)) {
    try {
      const fileHandle = await dirHandle.getFileHandle(filename, { create: false });
      const file = await fileHandle.getFile();
      let content = await file.text();

      for (const c of changes) {
        const search = c.before;
        const replace = state[c.id].text;
        if (content.includes(search)) {
          content = content.split(search).join(replace);
          results.push({ id: c.id, status: 'applied' });
          appliedCount++;
        } else {
          results.push({ id: c.id, status: 'not_found' });
          notFoundCount++;
        }
      }

      // Write back
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();

    } catch (e) {
      changes.forEach(c => results.push({ id: c.id, status: 'error', msg: e.message }));
      toast('Error updating ' + filename + ': ' + e.message, true);
    }
  }

  // Mark applied cards
  results.filter(r => r.status === 'applied').forEach(r => {
    const card = document.getElementById('card-' + r.id);
    if (card) card.classList.add('applied');
  });

  applyBtn.textContent = '✓ Applied ' + appliedCount + ' change' + (appliedCount===1?'':'s');
  applyBtn.className = 'btn-apply done';

  if (notFoundCount > 0) {
    toast(`⚠ ${appliedCount} applied, ${notFoundCount} not matched (text may have already changed)`, true);
  } else {
    toast(`✓ ${appliedCount} change${appliedCount===1?'':'s'} written to your website files`);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
