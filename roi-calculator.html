<script>
/* ACCOUNTIQ DEMO BUILD
   Standalone, static, fully synthetic sales-demo copy of AccountIQ.
   No network calls, no external connectors — every account, opportunity,
   health score, note, email, meeting, and Call Intelligence result below
   is fabricated for demonstration purposes only. */
// ---------------------------------------------------------------------
// Date anchor + small deterministic helpers used to fabricate the dataset
// ---------------------------------------------------------------------
const ANCHOR = new Date(2026, 6, 29); // "today" for the purposes of authoring this dataset
function back(days) { const d = new Date(ANCHOR); d.setDate(d.getDate() - days); return d.toISOString().slice(0, 10); }
function fwd(days) { return back(-days); }
function backMonths(months) { const d = new Date(ANCHOR); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0, 10); }
function seededRand(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (h * 31 + seedStr.charCodeAt(i)) | 0;
  return function () { h = (h * 1103515245 + 12345) | 0; return ((h >>> 0) / 4294967295); };
}
// Deterministic 12-month series ending at the current (partial) calendar
// month, given an end value and a steady month-over-month trend.
function genMonthlySeries(endValue, trendPctPerMonth, seed) {
  const rand = seededRand(seed);

function buildOwnershipStints(changes, currentOwner, accountCreatedDate) {
  const stints = [];
  if (!changes.length) { stints.push({ owner: currentOwner, start: accountCreatedDate, end: null, fallback: true }); return stints; }
  changes.forEach((c, i) => {
    if (i === 0 && c.from) stints.push({ owner: c.from, start: accountCreatedDate, end: c.date });
    const nextDate = (changes[i + 1] && changes[i + 1].date) || null;
    stints.push({ owner: c.to, start: c.date, end: nextDate });
  });
  return stints;
}
const HISTORY_DISPLAY_DAYS = 365;
function stintsWithinWindow(stints, days) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  return stints.filter(s => !s.end || new Date(s.end + "T00:00:00") >= cutoff);
}
function ownerHistoryHtml(allStints) {
  const stints = stintsWithinWindow(allStints, HISTORY_DISPLAY_DAYS);
  const hiddenCount = allStints.length - stints.length;
  const rows = stints.slice().reverse().map(s => {
    const isCurrent = !s.end;
    const range = s.fallback
      ? `since ${fmtOwnerHistoryDate(s.start)} <span class="muted">(no reassignment on record)</span>`
      : `${fmtOwnerHistoryDate(s.start)} – ${isCurrent ? "now" : fmtOwnerHistoryDate(s.end)}`;
    const dur = formatDuration(s.start, s.end);
    return `<li><span><span class="owner-history-name">${escHtml(s.owner || "Unknown")}</span>${isCurrent ? ' <span class="owner-history-current">current</span>' : ""}</span><span class="owner-history-range">${range}${dur ? ` · ${dur}` : ""}</span></li>`;
  });
  const hiddenNote = hiddenCount > 0 ? `<div class="muted" style="font-size:10.5px; margin-top:6px;">+${hiddenCount} earlier owner${hiddenCount === 1 ? "" : "s"} not shown (more than 1 year ago)</div>` : "";
  return `<ul class="owner-history-list">${rows.join("")}</ul>${hiddenNote}`;
}
function ownerTenureLabelFor(stints) {
  const current = stints[stints.length - 1];
  const dur = formatDuration(current.start, null);
  return dur ? `held ${dur}` : '<span class="muted">—</span>';
}

      pricing: `Pricing was presented; ${champ} asked for a follow-up on multi-year discounting before finalizing.`
    },
    risk: {
      eb: `${ebName} has not engaged on this renewal directly — ${champ} is fielding budget questions alone so far.`,
      tech: `${v.riskFactor || "Usage has dropped off since the last call, and the team could not point to a clear active use case."}`,
      legal: `No redline activity yet; legal review has not formally started with the renewal this close.`,
      timeline: `${champ} would not commit to a signature date on the call and asked to circle back "next quarter."`,
      pricing: `Pricing conversation stalled — ${champ} flagged budget scrutiny and asked for a lower renewal number.`
    }
  }[t];
  const checkMeta = [
    { id: "eb", label: "EB Sign-off" }, { id: "tech", label: "Technical Win" }, { id: "legal", label: "Legal Complete" },
    { id: "timeline", label: "Timeline Understood" }, { id: "pricing", label: "Pricing Finalized" }
  ];
  const checks = { scorecard: checkMeta.map((m, i) => ({
    id: m.id, label: m.label, status: P.statuses[i], confidence: P.confidences[i], evidence: checkText[m.id],
    nextAction: t === "strong" ? "Keep momentum — confirm signature logistics." : t === "mixed" ? "Follow up within a week to close the open items." : "Escalate internally — this renewal needs exec attention now."
  })) };

  const dimRationale = t === "strong" ? `${rep} handled this well — clear, confident, and specific to ${v.name}'s situation.`
    : t === "mixed" ? `${rep} covered the basics but left some follow-up open on this front.`
    : `${rep} would benefit from pushing harder here — this was glossed over on the call.`;
  const repCoaching = {
    prospect: v.name, rep, callType: "Renewal Conversation",
    strengths: [{ point: t === "risk" ? "Stayed calm under a tense conversation" : "Strong rapport with the champion", evidence: v.keyMoment || `${rep} kept the conversation moving and referenced specifics from ${v.name}'s account history.` }],
    opportunities: [{ point: t === "strong" ? "Could have asked for an expansion signal" : "Needs to get to the economic buyer directly", evidence: v.riskFactor || `${ebName} still hasn't been on a call this cycle.`, alternative: `Ask ${champ} directly: "Who else needs to be in the room before we can finalize this?"` }],
    scorecard: CI_DIMS.map((d, i) => ({ dimension: d, score: P.dims[i], rationale: dimRationale })),
    totalScore: P.dims.reduce((a, b) => a + b, 0),
    topCoachingFocus: v.focusArea || (t === "risk" ? "Get direct EB access before the next call — this renewal is too exposed right now." : t === "mixed" ? "Tighten the timeline commitment — don't leave the close date open-ended." : "Look for the expansion signal next time — this account is ready to grow."),
    selfReflectionQuestions: [
      "Did I confirm a specific next step with a date attached before ending the call?",
      "Did I get real signal from the economic buyer, or only from the champion?",
      "What would I do differently if this exact account came up again next quarter?"
    ]
  };

  const testEvidence = {
    "Organizational Knowledge": `${champ} could speak clearly to how ${v.name}'s teams actually use the product day to day.`,
    "Internal Advocacy": t === "risk" ? (v.riskFactor || `${champ} would not say whether they'd personally push for renewal internally.`) : `${champ} referenced pushing this internally with their own leadership.`,
    "Personal Stake": t === "risk" ? `${champ} did not tie the renewal to their own goals or performance.` : `${champ} tied the renewal outcome directly to a goal they personally own this year.`,
    "Economic Buyer Access": (v.eb && t !== "risk") ? `${champ} offered to loop in ${ebName} directly.` : `No direct path to the economic buyer has been offered yet.`,
    "Business Language": `${champ} ${t === "risk" ? "spoke mostly in feature terms rather than business outcomes" : "connected the renewal to a business metric leadership tracks"}.`,
    "Willingness to Be Tested": t === "strong" ? `${champ} volunteered to make the internal case without being asked twice.` : "Not yet tested directly on the call."
  };
  const strengthAttrs = ["Organizational Influence","Economic Buyer Access","Personal Investment","Internal Advocacy","Business Acumen","Trustworthiness & Candor"];
  const strengthMult = t === "strong" ? 1 : t === "mixed" ? 0.8 : 0.6;
  const strengthScorecard = strengthAttrs.map((a, i) => ({ attribute: a, score: Math.min(5, Math.max(1, Math.round(P.dims[i] * strengthMult))), notes: "" }));
  const champion = {
    account: v.name, contactName: champ, contactTitle: v.championTitle || "", rep,
    verdict: t === "strong" ? "TRUE CHAMPION" : t === "mixed" ? "LIKELY COACH" : "PROBABLE BLOCKER",
    verdictSummary: v.keyMoment || (t === "strong" ? `${champ} is actively driving this renewal and has offered to bring in other stakeholders.` : t === "mixed" ? `${champ} is friendly and informative but hasn't shown they can move this internally on their own.` : `${champ} ${v.riskFactor || "has gone quiet on internal advocacy and could not confirm the budget approval path."}`),
    tests: CI_TEST_DEFS.map((n, i) => ({ name: n, result: CI_TEST_RESULTS[t][i], evidence: testEvidence[n] })),
    riskFlags: t === "risk" ? [v.riskFactor || `${champ} has not confirmed they can get budget approved this cycle.`, `No confirmed path to ${ebName}.`] : (t === "mixed" ? [`${champ} has not yet looped in ${ebName} directly.`] : []),
    untestedDimensions: t === "strong" ? [] : ["Willingness to Be Tested"],
    developmentActions: [{ action: `Ask ${champ} to set up a short call directly with ${ebName}.`, suggestedLanguage: `"Would it help if we put together a one-pager for ${ebName} ahead of the renewal?"` }],
    alternativeTargets: t === "risk" ? [v.altTarget || "secondary product user mentioned on the call"] : [],
    strengthScorecard,
    championStrengthScore: strengthScorecard.reduce((a, b) => a + b.score, 0)
  };
  return { checks, repCoaching, champion };
}

function fakeFiles(name) {
  return `<div class="file-item"><div class="row-top"><a class="item-title plain" href="#" onclick="return false;">${escHtml(name)} — Renewal Business Case.pptx</a><span class="item-meta">${timeAgo(back(40))}</span></div><div class="item-sub">Account team</div></div>` +
    `<div class="file-item"><div class="row-top"><a class="item-title plain" href="#" onclick="return false;">${escHtml(name)} — MSA Redline v2.docx</a><span class="item-meta">${timeAgo(back(95))}</span></div><div class="item-sub">Legal</div></div>`;
}
function buildPulseFor(spec) {
  if (spec.status) return { summary: spec.summary || "", nextSteps: "", risks: "" };
  const delta = spec.renewalARR - spec.currentARR;
  const deltaLabel = Math.abs(delta) < 1 ? "flat" : delta > 0 ? `up ~${Math.round(delta / spec.currentARR * 100)}%` : `down ~${Math.round(-delta / spec.currentARR * 100)}%`;
  const color = spec.health.likelihoodToRenew.includes("Red") ? "red" : spec.health.likelihoodToRenew.includes("Amber") ? "amber" : "green";
  const summary = `${spec.name} is tracking ${deltaLabel} versus current ARR ahead of its renewal. ${color === "red" ? "Health is red — this deal needs active management." : color === "amber" ? "Health is amber — a few open items remain before this is safely closed." : "Health is green and the renewal is progressing normally."}`;
  const nextSteps = spec.callIntel && spec.callIntel.focusArea ? `- ${spec.callIntel.focusArea}` : `- Confirm signature timeline with ${spec.championName || "the champion"}.\n- Send the updated order form ahead of the close date.`;
  const risks = color === "red" ? `- ${(spec.callIntel && (spec.callIntel.riskFactor || spec.callIntel.keyMoment)) || "Renewal is at risk — see Call Intelligence for details."}` : color === "amber" ? "- Keep an eye on budget approval timing." : "- No material risks flagged this cycle.";
  return { summary, nextSteps, risks };
}
function buildAeRdNotesFor(spec) {
  if (spec.status) return { aeNotes: `${back(spec.closeDaysAgo)} — ${spec.summary || ""}`, rdNotes: "" };
  const aeNotes = `${back(10)} — Spoke with ${spec.championName || "the account contact"}. ${(spec.callIntel && (spec.callIntel.keyMoment || spec.callIntel.riskFactor || spec.callIntel.strengthFactor)) || "Renewal on track."}\n\n${back(35)} — Initial renewal outreach sent, awaiting confirmation on timeline.`;
  const rdNotes = spec.ebName ? `${back(20)} — ${spec.ebName} (${spec.ebTitle || "EB"}) looped in on pricing discussion.` : `${back(20)} — No executive buyer engaged yet this cycle.`;
  return { aeNotes, rdNotes };
}

  const fyq = deriveFiscalYQ(closeDate) || { fy: null, q: null };

  const row = {
    id: isClosed ? (spec.id + "-" + (opts.oppSuffix || "closed")) : accountId,
    accountId: isClosed ? accountId : undefined,
    name: spec.name,
    accountCreatedDate: createdDate,
    championId: "fake-champ-" + accountId, championName: spec.championName || null,
    ebId: spec.ebName ? ("fake-eb-" + accountId) : null, ebName: spec.ebName || null,
    company, health: spec.health,
    owner: spec.owner,
    currentARR: isClosed ? spec.priorARR : spec.currentARR,
    arrIsBaseline: isClosed,
    dataFlag: null,
    status: isClosed ? spec.status : undefined,
    renewal: {
      oppId: opts.oppId || (accountId + "-opp"),
      stage: opts.stage || spec.stage,
      amount: isClosed ? spec.renewalARR : (opts.arr !== undefined ? opts.arr : spec.renewalARR),
      arr: isClosed ? spec.renewalARR : (opts.arr !== undefined ? opts.arr : spec.renewalARR),
      closeDate,
      fy: fyq.fy, q: fyq.q,
      type: opts.type || "Renewal Business",
      ownerName: spec.owner,
      forecastStatus: opts.forecastStatus || spec.forecastStatus,
      termMonths: opts.termMonths || spec.termMonths
    },
    news,
    _cache: cache,
    _health: cache
  };

  if (!mauByAccount.has(accountId)) mauByAccount.set(accountId, seriesToMauEntry(genMonthlySeries(spec.mauBase, spec.mauTrend, accountId + "-mau")));
  if (!projectsByAccount.has(accountId)) projectsByAccount.set(accountId, { series: genMonthlySeries(spec.projBase, spec.projTrend, accountId + "-proj") });
  if (!modelsByAccount.has(accountId)) modelsByAccount.set(accountId, { series: genMonthlySeries(spec.modelBase, spec.modelTrend, accountId + "-model") });

  return row;
}

function assembleViews() {
  const mk = () => ({ teamMembers: [], allRows: [], closedRows: [], closedLoaded: true, closedLoading: false, closedError: null });
  const views = {
    commercial: { renewals: mk(), incremental: mk() },
    enterprise: { renewals: mk(), incremental: mk() }
  };
  OPEN_RENEWAL_SPECS.forEach(spec => {
    views[spec.team].renewals.allRows.push(buildRow(spec, { oppId: spec.id + "-renewal-opp" }));
  });
  CLOSED_RENEWAL_SPECS.forEach(spec => {
    views[spec.team].renewals.closedRows.push(buildRow(spec, { oppId: spec.id + "-closed-opp" }));
  });
  INCREMENTAL_ADDON_SPECS.forEach(inc => {
    const base = OPEN_RENEWAL_SPECS.find(s => s.id === inc.baseId);
    views[base.team].incremental.allRows.push(buildRow(base, {
      oppId: inc.baseId + "-" + inc.suffix + "-opp", arr: inc.arr, closeOffset: inc.closeOffset,
      forecastStatus: inc.forecastStatus, stage: inc.stage, termMonths: inc.termMonths, type: inc.type
    }));
  });
  Object.keys(views).forEach(teamKey => {
    ["renewals", "incremental"].forEach(dt => {
      const members = new Set();
      views[teamKey][dt].allRows.concat(views[teamKey][dt].closedRows).forEach(r => members.add(r.owner));
      views[teamKey][dt].teamMembers = [...members].sort().map(name => ({ id: name, name }));
    });
  });
  return views;
}

function renderDealTypeChips() {

function renderViewToggle() {

function applyView(viewKey) { if (!VIEWS[viewKey]) return; currentView = viewKey; loadActiveDataset(); }
function applyDealType(newDealType) { if (newDealType === dealType) return; dealType = newDealType; loadActiveDataset(); }

function getFilteredRows() {
  const rows = allRows.filter(r => activeTeam.has(r.owner) && activeFY.has(r.renewal.fy) && activeQ.has(r.renewal.q) && activeForecast.has(forecastBucketOrOther(r.renewal.forecastStatus)));
  rows.sort((a, b) => (a.renewal.closeDate !== b.renewal.closeDate ? (a.renewal.closeDate < b.renewal.closeDate ? -1 : 1) : a.name.localeCompare(b.name)));
  return rows;
}
function filterGenericRows(rows) {
  const filtered = rows.filter(r => activeTeam.has(r.owner) && activeFY.has(r.renewal.fy) && activeQ.has(r.renewal.q) && activeForecast.has(forecastBucketOrOther(r.renewal.forecastStatus)));
  filtered.sort((a, b) => (a.renewal.closeDate !== b.renewal.closeDate ? (a.renewal.closeDate > b.renewal.closeDate ? -1 : 1) : a.name.localeCompare(b.name)));
  return filtered;
}

function buildClosedGroupSection(kind, label, rows, collapsed) {
  const section = document.createElement("div");
  section.className = "closed-section";
  const sumCurrentARR = rows.reduce((s, r) => s + (r.currentARR || 0), 0);
  const sumRenewalARR = kind === "lost" ? 0 : rows.reduce((s, r) => s + (r.renewal.arr || 0), 0);
  const header = document.createElement("div");
  header.className = "closed-header";
  header.innerHTML = `
    <span class="chevron">${collapsed ? "▸" : "▾"}</span>
    <span class="closed-label">${escHtml(label)}</span>
    <span class="closed-count">${rows.length} account${rows.length === 1 ? "" : "s"}</span>
    <span class="closed-stat">Current ARR <b>${fmtAmount(sumCurrentARR)}</b></span>
    <span class="closed-stat">Renewal ARR <b>${fmtAmount(sumRenewalARR)}</b></span>
  `;
  header.addEventListener("click", () => { if (kind === "won") wonCollapsed = !wonCollapsed; else lostCollapsed = !lostCollapsed; renderTable(); });
  section.appendChild(header);
  if (!collapsed) {
    if (!rows.length) {
      const p = document.createElement("div"); p.className = "empty"; p.textContent = `No ${label.toLowerCase()} renewals in this window.`; section.appendChild(p);
    } else {
      const table = document.createElement("table");
      const thead = document.createElement("thead"); thead.innerHTML = tableHeadHtml();
      const tbody = document.createElement("tbody");
      table.appendChild(thead); table.appendChild(tbody); section.appendChild(table);
      buildRowsIntoTbody(tbody, rows);
    }
  }
  return section;
}

function renderTable() {
  const rows = getFilteredRows();
  const teamData = VIEWS[currentView] || {};
  const view = teamData[dealType] || {};
  const showClosed = renewalMode === "all";
  const closedWonRows = showClosed ? filterGenericRows((view.closedRows || []).filter(r => r.status === "won")) : [];
  const closedLostRows = showClosed ? filterGenericRows((view.closedRows || []).filter(r => r.status === "lost")) : [];
  const closedReady = showClosed;

  const summary = document.getElementById("summaryBar");
  const flaggedCount = rows.filter(r => r.dataFlag).length;
  let commitARR = 0, strongARR = 0, weakARR = 0, omitARR = 0;
  rows.forEach(r => {
    const arr = r.renewal.arr || 0;
    const bucket = forecastBucket(r.renewal.forecastStatus);
    if (bucket === "commit") commitARR += arr; else if (bucket === "strong") strongARR += arr; else if (bucket === "weak") weakARR += arr; else if (bucket === "omit") omitARR += arr;
  });
  const bookedARR = closedWonRows.reduce((s, r) => s + (r.renewal.arr || 0), 0);

  if (dealType === "incremental") {
    const pipelineARR = rows.reduce((s, r) => s + (r.renewal.arr || 0), 0);
    const lostARR = closedLostRows.reduce((s, r) => s + (r.renewal.arr || 0), 0);
    const pessimisticARR = commitARR * FORECAST_WEIGHTS.commit + strongARR * FORECAST_WEIGHTS.strongPessimistic + (closedReady ? bookedARR : 0);
    const optimisticARR = commitARR * FORECAST_WEIGHTS.commit + strongARR * FORECAST_WEIGHTS.strongOptimistic + weakARR * FORECAST_WEIGHTS.weakOptimistic + (closedReady ? bookedARR : 0);
    summary.innerHTML = `
      <div class="stat-row">
        <div class="stat-row-label">Pipeline</div>
        <div class="stat-card"><div class="stat-label">Open Deals</div><div class="stat-value">${rows.length}</div><div class="stat-caption">${fmtAmount(pipelineARR)} deal ARR</div></div>
        <div class="stat-card wide"><div class="stat-label">Forecast Mix (open)</div><div class="forecast-mix">
          <span class="mix-pill mix-commit"><span class="dot"></span>Commit ${fmtAmount(commitARR)}</span>
          <span class="mix-pill mix-strong"><span class="dot"></span>Strong ${fmtAmount(strongARR)}</span>
          <span class="mix-pill mix-weak"><span class="dot"></span>Weak ${fmtAmount(weakARR)}</span>
          <span class="mix-pill mix-omit"><span class="dot"></span>Omit ${fmtAmount(omitARR)}</span>
        </div></div>
      </div>
      ${closedReady ? `<div class="stat-row"><div class="stat-row-label">Closed This Window</div>
        <div class="stat-card wide"><div class="stat-label">Booked (Closed Won)</div><div class="stat-value">${fmtAmount(bookedARR)}</div><div class="stat-caption">${closedWonRows.length} deal${closedWonRows.length === 1 ? "" : "s"}</div></div>
        <div class="stat-card wide"><div class="stat-label">Lost (Closed Lost)</div><div class="stat-value">${fmtAmount(lostARR)}</div><div class="stat-caption">${closedLostRows.length} deal${closedLostRows.length === 1 ? "" : "s"}</div></div>
      </div>` : ""}
      <div class="stat-row"><div class="stat-row-label">Forecast Bands${closedReady ? " (incl. booked)" : ""}</div>
        <div class="stat-card wide"><div class="stat-label">Pessimistic <span class="muted" style="font-weight:400;">· Commit 100% + Strong 50%${closedReady ? " + Booked 100%" : ""}</span></div><div class="stat-value">${fmtAmount(pessimisticARR)}</div></div>
        <div class="stat-card wide"><div class="stat-label">Optimistic <span class="muted" style="font-weight:400;">· Commit 100% + Strong 80% + Weak 50%${closedReady ? " + Booked 100%" : ""}</span></div><div class="stat-value">${fmtAmount(optimisticARR)}</div></div>
      </div>
      ${flaggedCount ? `<div class="flag-banner">⚠️ <b>${flaggedCount}</b> flagged for data cleanup</div>` : ""}
    `;
  } else {
    const availableToRenewARR = rows.reduce((s, r) => s + (r.currentARR || 0), 0);
    const cappedBookedARR = closedWonRows.reduce((s, r) => s + Math.min(r.renewal.arr || 0, r.currentARR || 0), 0);
    const wonAtStakeARR = closedWonRows.reduce((s, r) => s + (r.currentARR || 0), 0);
    const lostAtStakeARR = closedLostRows.reduce((s, r) => s + (r.currentARR || 0), 0);
    const wonGdrPct = wonAtStakeARR ? Math.round((cappedBookedARR / wonAtStakeARR) * 100) : 0;
    const wonNdrPct = wonAtStakeARR ? Math.round((bookedARR / wonAtStakeARR) * 100) : 0;
    const atStakeARR = closedReady ? (availableToRenewARR + wonAtStakeARR + lostAtStakeARR) : availableToRenewARR;
    const pessimisticARR = commitARR * FORECAST_WEIGHTS.commit + strongARR * FORECAST_WEIGHTS.strongPessimistic + (closedReady ? cappedBookedARR : 0);
    const optimisticARR = commitARR * FORECAST_WEIGHTS.commit + strongARR * FORECAST_WEIGHTS.strongOptimistic + weakARR * FORECAST_WEIGHTS.weakOptimistic + (closedReady ? cappedBookedARR : 0);
    const pessimisticPct = atStakeARR ? Math.round((pessimisticARR / atStakeARR) * 100) : 0;
    const optimisticPct = atStakeARR ? Math.round((optimisticARR / atStakeARR) * 100) : 0;
    summary.innerHTML = `
      <div class="stat-row">
        <div class="stat-row-label">Pipeline</div>
        <div class="stat-card"><div class="stat-label">Open Renewals</div><div class="stat-value">${rows.length}</div><div class="stat-caption">${fmtAmount(availableToRenewARR)} available to renew</div></div>
        ${closedReady ? `<div class="stat-card wide"><div class="stat-label">Total At Stake</div><div class="stat-value">${fmtAmount(atStakeARR)}</div><div class="stat-caption">open + won baseline + lost baseline</div></div>` : ""}
        <div class="stat-card wide"><div class="stat-label">Forecast Mix (open)</div><div class="forecast-mix">
          <span class="mix-pill mix-commit"><span class="dot"></span>Commit ${fmtAmount(commitARR)}</span>
          <span class="mix-pill mix-strong"><span class="dot"></span>Strong ${fmtAmount(strongARR)}</span>
          <span class="mix-pill mix-weak"><span class="dot"></span>Weak ${fmtAmount(weakARR)}</span>
          <span class="mix-pill mix-omit"><span class="dot"></span>Omit ${fmtAmount(omitARR)}</span>
        </div></div>
      </div>
      ${closedReady ? `<div class="stat-row"><div class="stat-row-label">Closed This Window</div>
        <div class="stat-card wide"><div class="stat-label">Booked (Closed Won)</div><div class="stat-value">${fmtAmount(bookedARR)} <span class="stat-caption" style="display:inline;">of ${fmtAmount(wonAtStakeARR)} at stake</span></div><div class="stat-caption"><span class="pct" style="font-weight:700;">${wonGdrPct}% GDR</span> · <span class="pct" style="font-weight:700;">${wonNdrPct}% NDR</span></div></div>
        <div class="stat-card wide"><div class="stat-label">Lost (Closed Lost)</div><div class="stat-value">$0 <span class="stat-caption" style="display:inline;">of ${fmtAmount(lostAtStakeARR)} at stake</span></div><div class="stat-caption">nothing retained</div></div>
      </div>` : ""}
      <div class="stat-row"><div class="stat-row-label">Forecast Bands${closedReady ? " (incl. booked)" : ""}</div>
        <div class="stat-card wide"><div class="stat-label">Pessimistic <span class="muted" style="font-weight:400;">· Commit 100% + Strong 50%${closedReady ? " + Booked 100%" : ""}</span></div><div class="stat-value">${fmtAmount(pessimisticARR)}</div><div class="stat-caption"><span class="pct" style="font-weight:700;">${pessimisticPct}%</span> GDR</div></div>
        <div class="stat-card wide"><div class="stat-label">Optimistic <span class="muted" style="font-weight:400;">· Commit 100% + Strong 80% + Weak 50%${closedReady ? " + Booked 100%" : ""}</span></div><div class="stat-value">${fmtAmount(optimisticARR)}</div><div class="stat-caption"><span class="pct" style="font-weight:700;">${optimisticPct}%</span> GDR</div></div>
      </div>
      ${flaggedCount ? `<div class="flag-banner">⚠️ <b>${flaggedCount}</b> flagged for data cleanup</div>` : ""}
    `;
  }

  const wrap = document.getElementById("tableWrap");
  const pager = document.getElementById("pager");
  wrap.innerHTML = ""; pager.style.display = "none";
  if (!rows.length) {
    const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No open renewals match the current filters."; wrap.appendChild(empty);
  } else {
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = rows.slice(start, start + PAGE_SIZE);
    const table = document.createElement("table");
    const thead = document.createElement("thead"); thead.innerHTML = tableHeadHtml();
    const tbody = document.createElement("tbody"); tbody.id = "tbody";
    table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table);
    buildRowsIntoTbody(tbody, pageRows);
    if (totalPages > 1) {
      pager.style.display = "flex";
      pager.innerHTML = `<button id="prevPage" ${currentPage === 1 ? "disabled" : ""}>Prev</button><span>Page ${currentPage} of ${totalPages}</span><button id="nextPage" ${currentPage === totalPages ? "disabled" : ""}>Next</button>`;
      const prev = document.getElementById("prevPage"), next = document.getElementById("nextPage");
      if (prev) prev.addEventListener("click", () => { currentPage--; expandedKey = null; renderTable(); });
      if (next) next.addEventListener("click", () => { currentPage++; expandedKey = null; renderTable(); });
    }
  }
  if (showClosed) {
    const closedWrap = document.createElement("div");
    closedWrap.className = "closed-wrap";
    closedWrap.appendChild(buildClosedGroupSection("won", "Closed Won", closedWonRows, wonCollapsed));
    closedWrap.appendChild(buildClosedGroupSection("lost", "Closed Lost", closedLostRows, lostCollapsed));
    wrap.appendChild(closedWrap);
  }
}

function loadActiveDataset() {
  const teamData = VIEWS[currentView];
  const data = teamData && teamData[dealType];
  if (!data) return;
  teamMembers = data.teamMembers;
  allRows = data.allRows;
  activeTeam = new Set(teamMembers.map(m => m.name));
  const years = [...new Set(allRows.map(r => r.renewal.fy))].filter(Boolean);
  activeFY = (currentFY && years.includes(currentFY)) ? new Set([currentFY]) : new Set(years);
  activeQ = currentQ ? new Set([currentQ]) : new Set([1,2,3,4]);
  activeForecast = new Set(FORECAST_BUCKETS.map(b => b.key));
  currentPage = 1; expandedKey = null;
  renderModeChips(); renderViewToggle(); renderDealTypeChips(); renderTeamChips(); renderFYChips(); renderQChips(); renderForecastChips();
  renderTable();
}

function init() {
  document.getElementById("subtitleText").textContent = "Renewal &amp; incremental pipeline across the Commercial and Enterprise segments — sample data for demonstration.".replace("&amp;", "&");
  document.getElementById("footerText").innerHTML = "AccountIQ &middot; Demo Workspace";
  const fyq = deriveFiscalYQ(ANCHOR.toISOString().slice(0, 10));
  currentFY = fyq ? fyq.fy : null;
  currentQ = fyq ? fyq.q : null;
  VIEWS = assembleViews();
  loadActiveDataset();
}
init();
</script>
